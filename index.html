<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nashville Chart Book</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    /* shell (binder) tokens */
    --shell-bg: #1B1913;
    --shell-panel: #262319;
    --shell-edge: #3A3627;
    --shell-text: #E8E0CC;
    --shell-text-dim: #948C74;
    --brass: #B8925A;
    --red: #B23A2E;

    /* chart page tokens */
    --paper: #F2ECDA;
    --paper-edge: #E4DCC3;
    --ink: #000000;
    --ink-soft: #4A5064;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--shell-bg);
    background-image: radial-gradient(ellipse at top, rgba(184,146,90,0.07), transparent 55%);
    color: var(--shell-text);
    font-family: 'Public Sans', sans-serif;
  }

  /* --- nav --- */

  .topnav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    border-bottom: 1px solid var(--shell-edge);
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .brand .brand-mark {
    font-family: 'Architects Daughter', cursive;
    font-size: 20px;
    color: var(--brass);
  }

  .nav-tabs { display: flex; gap: 4px; }

  .nav-tab {
    background: transparent;
    border: none;
    color: var(--shell-text-dim);
    font-family: 'Public Sans', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 0.02em;
    padding: 8px 16px;
    border-radius: 5px;
    cursor: pointer;
  }

  .nav-tab:hover { color: var(--shell-text); }

  .nav-tab.active {
    color: var(--shell-bg);
    background: var(--brass);
  }

  .auth-status {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .user-status {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-right: 16px;
    border-right: 1px solid var(--shell-edge);
  }

  .user-email {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--shell-text-dim);
  }

  .user-tier {
    font-family: 'Public Sans', sans-serif;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--shell-bg);
    background: var(--brass);
    padding: 2px 7px;
    border-radius: 4px;
    margin-left: 8px;
  }

  .auth-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--shell-text-dim);
  }

  .auth-btn {
    background: transparent;
    border: 1px solid var(--shell-edge);
    color: var(--shell-text-dim);
    font-family: 'Public Sans', sans-serif;
    font-size: 11.5px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 5px;
    cursor: pointer;
  }
  .auth-btn:hover { color: var(--shell-text); border-color: var(--brass); }

  .login-view {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 70vh;
  }

  .login-panel {
    background: var(--shell-panel);
    border: 1px solid var(--shell-edge);
    border-radius: 10px;
    padding: 36px 32px;
    width: 100%;
    max-width: 340px;
  }

  .login-title {
    font-family: 'Architects Daughter', cursive;
    font-size: 24px;
    color: var(--brass);
    text-align: center;
    margin-bottom: 4px;
  }

  .login-subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--shell-text-dim);
    text-align: center;
    margin-bottom: 24px;
  }

  .login-toggle {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--shell-text-dim);
    margin-top: 14px;
  }
  .login-toggle a { color: var(--brass); text-decoration: none; }
  .login-toggle a:hover { text-decoration: underline; }

  #loginErrorMsg {
    color: var(--red);
    font-size: 12px;
    margin-top: 12px;
    text-align: center;
    display: none;
  }

  .fix-tonic-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .fix-tonic-panel {
    background: var(--shell-panel);
    border: 1px solid var(--shell-edge);
    border-radius: 10px;
    padding: 28px 26px;
    width: 100%;
    max-width: 360px;
    margin: 20px;
  }

  .fix-tonic-title {
    font-family: 'Architects Daughter', cursive;
    font-size: 20px;
    color: var(--brass);
    margin-bottom: 8px;
  }

  .fix-tonic-desc {
    font-size: 12px;
    color: var(--shell-text-dim);
    line-height: 1.6;
    margin: 0 0 18px 0;
  }

  .tier-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 18px;
    margin-bottom: 24px;
  }

  .tier-card {
    background: var(--shell-panel);
    border: 1px solid var(--shell-edge);
    border-radius: 10px;
    padding: 26px 22px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    position: relative;
  }

  .tier-card-current {
    border-color: var(--brass);
    box-shadow: 0 0 0 1px var(--brass);
  }

  .tier-current-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--shell-bg);
    background: var(--brass);
    padding: 3px 10px;
    border-radius: 4px;
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
  }

  .tier-current-btn {
    cursor: default;
    opacity: 0.7;
  }
  .tier-current-btn:hover { filter: none; }

  .tier-name {
    font-family: 'Architects Daughter', cursive;
    font-size: 20px;
    color: var(--brass);
  }

  .tier-price {
    font-family: 'Architects Daughter', cursive;
    font-size: 30px;
    color: var(--shell-text);
  }
  .tier-price span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--shell-text-dim);
  }

  .tier-limit {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--shell-text-dim);
    margin-bottom: 10px;
  }

  .tier-subscribe-btn {
    width: 100%;
    text-align: center;
    text-decoration: none;
    display: inline-block;
    box-sizing: border-box;
  }

  .paywall-footer {
    display: flex;
    justify-content: center;
    gap: 14px;
  }

  /* --- shared layout --- */

  .view {
    max-width: 900px;
    margin: 0 auto;
    padding: 36px 24px 64px;
  }

  .view-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .view-header h1 {
    font-family: 'Architects Daughter', cursive;
    font-size: 26px;
    color: var(--shell-text);
    margin: 0;
    font-weight: 400;
  }

  .view-header p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--shell-text-dim);
    margin: 4px 0 0 0;
  }

  button.shell-btn {
    background: var(--brass);
    color: var(--shell-bg);
    border: none;
    border-radius: 5px;
    padding: 9px 16px;
    font-family: 'Public Sans', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.02em;
    cursor: pointer;
  }

  button.shell-btn:hover { filter: brightness(1.1); }

  button.shell-btn.secondary {
    background: transparent;
    color: var(--shell-text-dim);
    border: 1px solid #4A4530;
  }

  /* --- library --- */

  .chart-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }

  .chart-card {
    background: var(--shell-panel);
    border: 1px solid var(--shell-edge);
    border-radius: 8px;
    padding: 18px;
    cursor: pointer;
    transition: border-color 0.15s;
    position: relative;
  }

  .chart-card:hover { border-color: var(--brass); }

  .chart-card .cc-title {
    font-family: 'Architects Daughter', cursive;
    font-size: 19px;
    color: var(--shell-text);
    margin-bottom: 10px;
    padding-right: 20px;
  }

  .chart-card .cc-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--shell-text-dim);
    line-height: 1.8;
  }

  .chart-card .cc-delete {
    position: absolute;
    top: 14px;
    right: 14px;
    color: var(--shell-text-dim);
    background: none;
    border: none;
    font-size: 14px;
    cursor: pointer;
    line-height: 1;
    padding: 2px 5px;
  }

  .chart-card .cc-delete:hover { color: var(--red); }

  .empty-library {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--shell-text-dim);
    text-align: center;
    padding: 60px 20px;
    border: 1px dashed var(--shell-edge);
    border-radius: 8px;
  }

  .empty-library button { margin-top: 14px; }

  /* --- new chart / upload view --- */

  .upload-panel {
    background: var(--shell-panel);
    border: 1px solid var(--shell-edge);
    border-radius: 8px;
    padding: 24px;
    margin-bottom: 18px;
  }

  .upload-panel p {
    font-size: 12px;
    color: var(--shell-text-dim);
    margin: 0 0 14px 0;
    line-height: 1.6;
  }

  .panel-heading {
    font-family: 'Architects Daughter', cursive;
    font-size: 18px;
    color: var(--shell-text);
    margin: 0 0 8px 0;
    font-weight: 400;
  }

  .managed-banner {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--brass);
    background: rgba(184, 146, 90, 0.1);
    border: 1px solid rgba(184, 146, 90, 0.35);
    border-radius: 6px;
    padding: 8px 12px;
    margin-bottom: 16px;
  }
  .managed-banner-off {
    color: var(--shell-text-dim);
    background: transparent;
    border-color: var(--shell-edge);
  }
  .managed-banner-off a { color: var(--brass); }

  .panel-divider {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--shell-text-dim);
    margin: 4px 0 18px 0;
  }

  .process-log {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    line-height: 1.7;
    color: var(--shell-text-dim);
    max-height: 220px;
    overflow-y: auto;
    margin-top: 12px;
  }

  .processing-indicator {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 28px 0 8px;
  }

  .pen-write-scene {
    position: relative;
    width: 240px;
    height: 60px;
  }

  .write-svg { width: 100%; height: 100%; }
  .write-path {
    stroke: var(--brass);
    stroke-dasharray: 400;
    stroke-dashoffset: 400;
    animation: penWriteLine 2.6s ease-in-out infinite;
  }

  .pen-emoji {
    position: absolute;
    top: -2px;
    left: 5%;
    font-size: 20px;
    color: var(--shell-text);
    transform: rotate(25deg);
    animation: penWriteMove 2.6s ease-in-out infinite;
  }

  @keyframes penWriteLine {
    0%   { stroke-dashoffset: 400; opacity: 1; }
    60%  { stroke-dashoffset: 0;   opacity: 1; }
    80%  { stroke-dashoffset: 0;   opacity: 0; }
    81%  { stroke-dashoffset: 400; opacity: 0; }
    100% { stroke-dashoffset: 400; opacity: 0; }
  }

  @keyframes penWriteMove {
    0%   { left: 3%;  opacity: 1; }
    60%  { left: 88%; opacity: 1; }
    80%  { opacity: 0; }
    81%  { left: 3%;  opacity: 0; }
    100% { left: 3%;  opacity: 0; }
  }

  .processing-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--shell-text-dim);
  }

  input[type="text"] {
    width: 100%;
    background: #14130E;
    border: 1px solid var(--shell-edge);
    border-radius: 4px;
    padding: 8px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--shell-text);
  }

  #processErrorMsg {
    color: var(--red);
    font-size: 12px;
    margin-top: 10px;
    display: none;
  }

  .drop-zone {
    position: relative;
    border: 2px dashed var(--shell-edge);
    border-radius: 8px;
    min-height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--brass);
    background: rgba(184, 146, 90, 0.06);
  }
  .drop-zone-text {
    font-family: 'Public Sans', sans-serif;
    font-size: 13px;
    color: var(--shell-text-dim);
    pointer-events: none;
  }
  .drop-zone-input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
  }

  .key-manage-link {
    margin-top: 12px;
    text-align: right;
  }
  .key-manage-link a {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--shell-text-dim);
    text-decoration: none;
  }
  .key-manage-link a:hover { color: var(--brass); }

  .field { margin-bottom: 14px; }

  .field label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--shell-text-dim);
    margin-bottom: 6px;
  }

  input[type="file"] {
    width: 100%;
    background: #14130E;
    border: 1px solid var(--shell-edge);
    border-radius: 4px;
    padding: 8px 10px;
    font-family: 'Public Sans', sans-serif;
    font-size: 12px;
    color: var(--shell-text);
  }

  textarea {
    width: 100%;
    height: 140px;
    background: #14130E;
    border: 1px solid var(--shell-edge);
    border-radius: 4px;
    padding: 10px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--shell-text);
    resize: vertical;
  }

  .btn-row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }

  #errorMsg {
    color: var(--red);
    font-size: 12px;
    margin-top: 10px;
    display: none;
  }

  /* --- chart view --- */

  .chart-view-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 760px;
    margin: 0 auto 14px;
  }

  .edit-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--shell-text-dim);
  }

  .toolbar-actions { display: flex; gap: 8px; }

  [contenteditable="true"] {
    outline: none;
    border-bottom: 1.5px dashed transparent;
    cursor: text;
    transition: border-color 0.15s;
  }
  [contenteditable="true"]:hover { border-bottom-color: var(--brass); }
  [contenteditable="true"]:focus {
    border-bottom-color: var(--red);
    background: rgba(178,58,46,0.06);
  }

  .sheet {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    background: var(--paper);
    border: 1px solid var(--paper-edge);
    box-shadow: 0 4px 22px rgba(0,0,0,0.35);
    padding: 40px 44px 50px;
    color: var(--ink);
  }

  .sheet-header { position: relative; height: 90px; margin-bottom: 34px; }

  .title-text {
    font-family: 'Architects Daughter', cursive;
    font-size: 29px;
    color: var(--ink);
    -webkit-text-stroke: 0.9px var(--ink);
    position: absolute;
    top: 6px;
    left: 0;
  }

  .header-wave { position: absolute; bottom: 0; left: 0; width: 62%; height: 20px; }

  .key-tempo-block {
    position: absolute;
    top: 2px;
    right: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-end;
  }

  .kt-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    padding: 5px 12px;
    min-width: 88px;
    justify-content: space-between;
  }

  .kt-chip .kt-label {
    font-family: 'Public Sans', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .kt-chip .kt-value {
    font-family: 'Architects Daughter', cursive;
    font-size: 17px;
    color: var(--ink);
    -webkit-text-stroke: 0.75px var(--ink);
  }

  .kt-select {
    font-family: 'Architects Daughter', cursive;
    font-size: 17px;
    color: var(--ink);
    -webkit-text-stroke: 0.75px var(--ink);
    background: transparent;
    border: none;
    outline: none;
    cursor: pointer;
  }

  .section-row {
    display: flex;
    align-items: baseline;
    margin-bottom: 30px;
    padding-top: 20px;
  }

  .section-row:first-child {
    padding-top: 0;
  }

  .section-row:not(:first-child) {
    border-top: 1px solid rgba(35, 40, 56, 0.18);
  }

  .section-label-col {
    width: 76px;
    flex-shrink: 0;
  }

  .section-label {
    font-family: 'Architects Daughter', cursive;
    font-size: 18px;
    color: var(--ink);
    -webkit-text-stroke: 0.75px var(--ink);
  }

  .section-controls {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-top: 6px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .section-row:hover .section-controls { opacity: 1; }

  .section-ctrl-btn {
    background: transparent;
    border: 1px solid var(--ink-soft);
    color: var(--ink-soft);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 3px;
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
  }
  .section-ctrl-btn:hover { border-color: var(--red); color: var(--red); }

  .bar-wrap {
    position: relative;
    display: inline-flex;
  }

  .bar-split-btn {
    position: absolute;
    bottom: -16px;
    right: -8px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--paper);
    border: 1px solid var(--ink-soft);
    color: var(--ink-soft);
    font-size: 9px;
    line-height: 14px;
    text-align: center;
    padding: 0;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 5;
  }
  .bar-wrap:hover .bar-split-btn { opacity: 1; }
  .bar-split-btn:hover { border-color: var(--red); color: var(--red); }

  .bar-delete-btn {
    position: absolute;
    top: -16px;
    left: -8px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--paper);
    border: 1px solid var(--ink-soft);
    color: var(--ink-soft);
    font-size: 8px;
    line-height: 14px;
    text-align: center;
    padding: 0;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 5;
  }
  .bar-wrap:hover .bar-delete-btn { opacity: 1; }
  .bar-delete-btn:hover { border-color: var(--red); color: var(--red); background: rgba(178,58,46,0.08); }

  .bar-add-btn {
    position: absolute;
    top: -30px;
    right: -8px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--paper);
    border: 1px solid var(--ink-soft);
    color: var(--ink-soft);
    font-size: 10px;
    line-height: 14px;
    text-align: center;
    padding: 0;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 5;
  }
  .bar-wrap:hover .bar-add-btn { opacity: 1; }
  .bar-add-btn:hover { border-color: var(--brass); color: var(--brass); }

  /* while a mark tool is selected, hide all structural-editing controls so
     there's nothing near the chord that could be clicked by accident */
  .sheet.tool-active .bar-split-btn,
  .sheet.tool-active .bar-delete-btn,
  .sheet.tool-active .bar-add-btn,
  .sheet.tool-active .section-controls,
  .sheet.tool-active .add-section-row {
    display: none !important;
  }

  .add-section-row {
    text-align: center;
    padding-top: 24px;
  }

  .add-section-btn {
    background: transparent;
    border: 1px dashed var(--ink-soft);
    color: var(--ink-soft);
    font-family: 'Public Sans', sans-serif;
    font-size: 11px;
    padding: 8px 18px;
    border-radius: 6px;
    cursor: pointer;
  }
  .add-section-btn:hover { border-color: var(--brass); color: var(--ink); }

  .section-bars {
    display: grid;

// ============================================================
// Ported from nashville.py -- lets the app process audio directly
// via Music AI without needing the Colab notebook at all.

const MUSICAI_PITCH_CLASSES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const MUSICAI_ENHARMONIC = {"Db":"C#","Eb":"D#","Gb":"F#","Ab":"G#","Bb":"A#","Fb":"E","Cb":"B","E#":"F","B#":"C"};
const MUSICAI_MAJOR_STEPS = [0, 2, 4, 5, 7, 9, 11];
const MUSICAI_MINOR_STEPS = [0, 2, 3, 5, 7, 8, 10];
const MUSICAI_NUMERAL_BY_DEGREE_MAJOR = {0:"1",2:"2",4:"3",5:"4",7:"5",9:"6",11:"7"};
const MUSICAI_NUMERAL_BY_DEGREE_MINOR = {0:"1",2:"2",3:"3",5:"4",7:"5",8:"6",10:"7"};
const MUSICAI_QUALITY_SUFFIX = {
  "maj":"", "maj6":"6", "maj7":"maj7",
  "min":"-", "min6":"-6", "min7":"-7", "minmaj7":"-maj7",
  "dim":"\u00b0", "dim7":"\u00b07", "hdim7":"\u00f87",
  "aug":"+", "7":"7", "sus2":"sus2", "sus4":"sus4",
};

function musicaiNormalizeRoot(root) {
  root = root.trim();
  return MUSICAI_ENHARMONIC[root] || root;
}

function musicaiParseChord(chordName) {
  if (chordName === "N" || chordName === "X") return [null, null];
  let root, quality;
  if (chordName.includes(":")) {
    const idx = chordName.indexOf(":");
    root = chordName.slice(0, idx);
    quality = chordName.slice(idx + 1);
  } else {
    root = chordName; quality = "maj";
  }
  return [musicaiNormalizeRoot(root), quality];
}

function chordToNashvilleNumeral(chordName, keyTonic, keyMode) {
  const [root, quality] = musicaiParseChord(chordName);
  if (root === null) return null;

  const tonicIdx = MUSICAI_PITCH_CLASSES.indexOf(keyTonic);
  const rootIdx = MUSICAI_PITCH_CLASSES.indexOf(root);
  const interval = ((rootIdx - tonicIdx) % 12 + 12) % 12;

  const degreeMap = keyMode === "major" ? MUSICAI_NUMERAL_BY_DEGREE_MAJOR : MUSICAI_NUMERAL_BY_DEGREE_MINOR;
  let numeral, accidental;
  if (degreeMap.hasOwnProperty(interval)) {
    numeral = degreeMap[interval];
    accidental = "";
  } else {
    const steps = keyMode === "major" ? MUSICAI_MAJOR_STEPS : MUSICAI_MINOR_STEPS;
    const candidates = steps.filter(s => s >= interval);
    const upper = candidates.length ? Math.min(...candidates) : steps[steps.length - 1];
    numeral = degreeMap[upper];
    accidental = interval !== upper ? "b" : "";
  }

  const suffix = MUSICAI_QUALITY_SUFFIX.hasOwnProperty(quality) ? MUSICAI_QUALITY_SUFFIX[quality] : quality;
  return `${accidental}${numeral}${suffix}`;
}

function parseMusicAiKeyString(keyString) {
  const parts = keyString.trim().split(/\s+/);
  const tonic = parts.length ? musicaiNormalizeRoot(parts[0]) : "C";
  let mode = parts.length > 1 ? parts[1].toLowerCase() : "major";
  if (mode !== "major" && mode !== "minor") mode = "major";
  return [tonic, mode];
}

function buildBarsFromMusicAiData(chordsData, keyTonic, keyMode) {
  if (!chordsData.length) return [];
  const maxBar = Math.max(...chordsData.map(c => c.end_bar));

  const attacksByBar = {};
  for (const c of chordsData) {
    const rawChord = c.chord_majmin || "N";
    if (rawChord === "N" || rawChord === "X") continue;
    const numeral = chordToNashvilleNumeral(rawChord, keyTonic, keyMode);
    if (numeral === null) continue;
    const barNum = c.start_bar;
    const beatNum = c.start_beat !== undefined ? c.start_beat : 1;
    if (!attacksByBar[barNum]) attacksByBar[barNum] = [];
    attacksByBar[barNum].push({ numeral, beat: beatNum });
  }

  const bars = [];
  let activeNumeral = null;
  for (let barNum = 1; barNum <= maxBar; barNum++) {
    const entries = attacksByBar[barNum] || [];
    if (entries.length) {
      bars.push(entries);
      activeNumeral = entries[entries.length - 1].numeral;
    } else if (activeNumeral !== null) {
      bars.push([{ numeral: activeNumeral, beat: 1 }]);
    } else {
      bars.push([{ numeral: "N.C.", beat: 1 }]);
    }
  }
  return bars;
}

function musicaiBarToShorthand(barEntries) {
  if (barEntries.length === 1) return barEntries[0].numeral;
  return { group: [barEntries[0].numeral, barEntries[barEntries.length - 1].numeral] };
}

function musicaiGetDownbeats(beats) {
  let downbeats = beats.filter(([t, b]) => b === 1.0).map(([t]) => t);
  if (!downbeats.length && beats.length) downbeats = [beats[0][0]];
  return downbeats;
}

const MUSICAI_LABEL_ABBREVIATIONS = {
  "start": null, "end": null,
  "intro": "Intro", "verse": "V", "chorus": "CH",

function assignMusicAiSections(bars, downbeats, segments) {
  function labelForTime(t) {
    for (const seg of segments) {
      if (seg.start <= t && t < seg.end) {
        const raw = seg.label.toLowerCase().trim();
        if (MUSICAI_LABEL_ABBREVIATIONS.hasOwnProperty(raw)) return MUSICAI_LABEL_ABBREVIATIONS[raw];
        return raw.charAt(0).toUpperCase() + raw.slice(1);
      }
    }
    return null;
  }

  const rawLabels = downbeats.slice(0, bars.length).map(labelForTime);

  const sections = [];
  const counts = {};
  let currentLabel = null;
  let currentBars = [];

  function flush() {
    if (currentLabel === null || !currentBars.length) return;
    let displayLabel;
    if (["Intro", "Outro", "Solo", "Inst", "BD"].includes(currentLabel)) {
      displayLabel = currentLabel;
    } else {
      counts[currentLabel] = (counts[currentLabel] || 0) + 1;
      displayLabel = `${currentLabel}${counts[currentLabel]}`;
    }
    sections.push({ label: displayLabel, bars: currentBars });
    currentBars = [];
  }

  for (let i = 0; i < bars.length; i++) {
    const label = rawLabels[i];
    if (label === null) {
      flush();
      currentLabel = null;
      continue;
    }
    if (label !== currentLabel) {
      flush();
      currentLabel = label;
    }
    currentBars.push(musicaiBarToShorthand(bars[i]));
  }
  flush();

  return sections;
}

async function musicaiPollAndGetResult(jobId, apiKey, logFn) {
  const maxAttempts = 80; // ~4 minutes
  for (let i = 0; i < maxAttempts; i++) {
    await new Promise(r => setTimeout(r, 3000));
    const resp = await fetch(`https://api.music.ai/v1/job/${jobId}/status`, { headers: { 'Authorization': apiKey } });
    if (!resp.ok) throw new Error(`Status check failed: HTTP ${resp.status}`);
    const data = await resp.json();
    logFn(`  [${(i + 1) * 3}s] status: ${data.status}`);
    if (data.status === 'SUCCEEDED') {
      const finalResp = await fetch(`https://api.music.ai/v1/job/${jobId}`, { headers: { 'Authorization': apiKey } });
      if (!finalResp.ok) throw new Error(`Fetching job result failed: HTTP ${finalResp.status}`);
      const finalData = await finalResp.json();
      return finalData.result;
    }
    if (data.status === 'FAILED') throw new Error('Job failed on Music AI\'s side.');
  }
  throw new Error('Timed out waiting for job to complete.');
}

async function musicaiUploadFile(apiKey, file, logFn) {
  const uploadUrlResp = await fetch('https://api.music.ai/v1/upload', { headers: { 'Authorization': apiKey } });
  if (!uploadUrlResp.ok) {
    const text = await uploadUrlResp.text();
    throw new Error(`Getting upload URL failed: HTTP ${uploadUrlResp.status} - ${text}`);
  }
  const { uploadUrl, downloadUrl } = await uploadUrlResp.json();
  const putResp = await fetch(uploadUrl, { method: 'PUT', body: file });
  if (!putResp.ok) throw new Error(`File upload failed: HTTP ${putResp.status}`);
  return downloadUrl;
}

}

async function processAudioViaRelay(chordsWorkflowSlug, sectionsWorkflowSlug, file, logFn) {
  logFn('Uploading audio for chords & beats job...');
  const { uploadUrl, downloadUrl } = await relayUploadFile();
  const putResp = await fetch(uploadUrl, { method: 'PUT', body: file });
  if (!putResp.ok) throw new Error(`File upload failed: HTTP ${putResp.status}`);

  logFn('Submitting chords & beats job...');
  const chordsJob = await relayCall('submit-job', { workflow: chordsWorkflowSlug, inputUrl: downloadUrl, name: 'Nashville chart' });
  logFn(`Chords job submitted: ${chordsJob.id}. Waiting...`);

  const chordsResult = await relayPollAndGetResult(chordsJob.id, logFn);
  const bpm = chordsResult.bpm;
  const keyString = chordsResult['root key'] || 'C major';
  logFn(`Key: ${keyString}, BPM: ${bpm}`);

  const chordsData = await (await fetch(chordsResult['chords map'])).json();
  logFn(`Got ${chordsData.length} chord segments.`);

  const beatsRaw = await (await fetch(chordsResult['beat map'])).json();
  const beatsList = beatsRaw.map(b => [b.time, b.beatNum]);
  const downbeats = musicaiGetDownbeats(beatsList);
  logFn(`Got ${downbeats.length} downbeats.`);

  let sectionsData = null;
  if (sectionsWorkflowSlug) {
    try {
      logFn('Re-uploading for sections job...');
      const { uploadUrl: uploadUrl2, downloadUrl: downloadUrl2 } = await relayUploadFile();
      const put2 = await fetch(uploadUrl2, { method: 'PUT', body: file });
      if (!put2.ok) throw new Error(`HTTP ${put2.status}`);
      logFn('Submitting sections job...');
      const sectionsJob = await relayCall('submit-job', { workflow: sectionsWorkflowSlug, inputUrl: downloadUrl2, name: 'Nashville chart - sections' });
      const sectionsResult = await relayPollAndGetResult(sectionsJob.id, logFn);
      sectionsData = await (await fetch(sectionsResult.sections)).json();
      logFn(`Got ${sectionsData.length} structural segments.`);
    } catch (err) {
      logFn(`Sections detection failed (${err.message}) -- continuing with one "Song" section.`);
      sectionsData = null;
    }
  }

  const [keyTonic, keyMode] = parseMusicAiKeyString(keyString);
  const bars = buildBarsFromMusicAiData(chordsData, keyTonic, keyMode);
  logFn(`Built ${bars.length} bars.`);

  const sections = sectionsData
    ? assignMusicAiSections(bars, downbeats, sectionsData)
    : [{ label: 'Song', bars: bars.map(musicaiBarToShorthand) }];

  // Only now, on genuine success, tell the relay to consume a unit of
  // usage (or the free trial) -- a failed attempt never costs the user.
  await relayCall('mark-complete', {});

  return {
    title: file.name.replace(/\.[^/.]+$/, ''),
    key: keyTonic,
    tempo: bpm ? String(bpm) : '',
    sections,
  };
}

let displayMode = 'numbers'; // 'numbers' | 'chords' -- purely a display transform, never mutates currentData
let editMode = false; // locked by default when a chart opens -- click "Edit" to unlock editing/structural controls

const CHROMATIC = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const FLAT_TO_SHARP = { Db: 'C#', Eb: 'D#', Gb: 'F#', Ab: 'G#', Bb: 'A#' };

const NASHVILLE_SUFFIX_TO_CHORD = {
  '': '', '-': 'm', '-6': 'm6', '-7': 'm7', '-maj7': 'm(maj7)',
  'maj7': 'maj7', '6': '6', '7': '7', 'sus2': 'sus2', 'sus4': 'sus4',
  '+': '+', '°': 'dim', '°7': 'dim7', 'ø7': 'm7b5'
};

const MAJOR_SCALE_STEPS = { 1: 0, 2: 2, 3: 4, 4: 5, 5: 7, 6: 9, 7: 11 };
const NUMERAL_DEGREE_MAP = { 0: '1', 2: '2', 4: '3', 5: '4', 7: '5', 9: '6', 11: '7' };
const MAJOR_DIATONIC_STEPS = [0, 2, 4, 5, 7, 9, 11];

function numeralToInterval(accidental, digit) {
  let semitone = MAJOR_SCALE_STEPS[digit];
  if (accidental === 'b') semitone -= 1;
  if (accidental === '#') semitone += 1;
  return ((semitone % 12) + 12) % 12;
}

function intervalToNumeralBase(interval) {
  interval = ((interval % 12) + 12) % 12;
  if (NUMERAL_DEGREE_MAP[interval]) return NUMERAL_DEGREE_MAP[interval];
  // Same "nearest diatonic degree at or above, flattened down" convention
  // used everywhere else in this app for chromatic chords.
  const candidates = MAJOR_DIATONIC_STEPS.filter(s => s >= interval);
  const upper = candidates.length ? Math.min(...candidates) : MAJOR_DIATONIC_STEPS[MAJOR_DIATONIC_STEPS.length - 1];
  return 'b' + NUMERAL_DEGREE_MAP[upper];
}

function transposeNumeral(numeral, shift) {
  const m = numeral.match(/^([b#]?)([1-7])(.*)$/);
  if (!m) return numeral; // not a real numeral (e.g. "%", "N.C.") -- leave untouched
  const [, accidental, digit, suffix] = m;
  const interval = numeralToInterval(accidental, digit);
  return intervalToNumeralBase(interval + shift) + suffix;
}

function transposeBarValue(bar, shift) {
  if (typeof bar === 'string') return transposeNumeral(bar, shift);
  if (bar.split) return { split: [transposeBarValue(bar.split[0], shift), transposeBarValue(bar.split[1], shift)] };
  if (bar.diamond) return { diamond: transposeBarValue(bar.diamond, shift) };
  if (bar.box) return { box: transposeBarValue(bar.box, shift) };
  if (bar.group) return { group: bar.group.map(item => transposeBarValue(item, shift)) };
  return bar;
}

function fixTonic(wrongNumeral, correctNumeral) {
  const mWrong = wrongNumeral.trim().match(/^([b#]?)([1-7])/);
  const mCorrect = correctNumeral.trim().match(/^([b#]?)([1-7])/);
  if (!mWrong || !mCorrect) {
    showToast('Enter numerals like "2-" or "b7", not chord names.');
    return false;
  }
  const wrongInterval = numeralToInterval(mWrong[1], mWrong[2]);
  const correctInterval = numeralToInterval(mCorrect[1], mCorrect[2]);
  const shift = ((correctInterval - wrongInterval) % 12 + 12) % 12;
  if (shift === 0) {
    showToast('Those are already the same -- nothing to fix.');
    return false;
  }

  currentData.sections.forEach(section => {
    section.bars = section.bars.map(bar => transposeBarValue(bar, shift));
  });
  // Shift the displayed key by the same interval so "Show Chords" mode
  // stays consistent with the corrected numerals.
  const keyIdx = CHROMATIC.indexOf(normalizeKey(currentData.key));
  currentData.key = CHROMATIC[((keyIdx + shift) % 12 + 12) % 12];

  renderChartView(currentData);
  showToast('Tonic corrected across the whole chart');
  return true;
}

function normalizeKey(raw) {
  if (!raw) return 'C';
  const first = raw.trim().split(/\s+/)[0];
  const normalized = FLAT_TO_SHARP[first] || first;
  return CHROMATIC.includes(normalized) ? normalized : 'C';
}

function numberToChordName(numeral, keyRoot) {
  if (numeral.includes('/')) {
    const slashIdx = numeral.indexOf('/');
    const mainPart = numeral.slice(0, slashIdx);
    const bassPart = numeral.slice(slashIdx + 1);
    return `${numberToChordName(mainPart, keyRoot)}/${numberToChordName(bassPart, keyRoot)}`;
  }

  const rootIdx = CHROMATIC.indexOf(normalizeKey(keyRoot));
  const m = numeral.match(/^([b#]?)([1-7])(.*)$/);
  if (!m) return numeral;
  const [, accidental, digit, suffix] = m;
  const semitone = numeralToInterval(accidental, digit);
  const chordRoot = CHROMATIC[(rootIdx + semitone) % 12];
  const chordSuffix = NASHVILLE_SUFFIX_TO_CHORD.hasOwnProperty(suffix) ? NASHVILLE_SUFFIX_TO_CHORD[suffix] : suffix;
  return chordRoot + chordSuffix;
}

function displayValueFor(raw) {
  if (displayMode !== 'chords' || raw === '%') return raw;
  return numberToChordName(raw, currentData.key);
}

// ---------- Google Drive sign-in ----------

const GOOGLE_CLIENT_ID = '451996104682-kj3dmo065dt1e4jh8to95j3etj473g6q.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';

let driveAccessToken = null;
let driveSignedIn = false;
let googleTokenClient = null;

let isSilentSignInAttempt = false;

// The token itself is genuinely short-lived (~1hr) by Google's own design
// for browser-only apps -- no refresh token is issued, on purpose, so a
// leaked token can't be used forever. Storing it lets it survive tab
// closes/reloads for the rest of its real lifetime, rather than requiring
// a fresh sign-in on every single page load.
function getStoredDriveToken() {
  try {
    const raw = localStorage.getItem('driveTokenData');
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data.token || !data.expiresAt || Date.now() >= data.expiresAt) {
      localStorage.removeItem('driveTokenData');
      return null;
    }
    return data.token;
  } catch (e) {
    return null;
  }
}
function setStoredDriveToken(token, expiresInSeconds) {
  try {
    const expiresAt = Date.now() + (expiresInSeconds * 1000) - 60000; // 1-min safety buffer
    localStorage.setItem('driveTokenData', JSON.stringify({ token, expiresAt }));
  } catch (e) {}
}
function clearStoredDriveToken() {
  try { localStorage.removeItem('driveTokenData'); } catch (e) {}
}

function initGoogleAuth() {
  if (googleTokenClient || typeof google === 'undefined') return;
  googleTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: (tokenResponse) => {
      if (tokenResponse.error) {
        if (!isSilentSignInAttempt) {
          showToast('Google sign-in failed: ' + tokenResponse.error);
        }
        isSilentSignInAttempt = false;
        return;
      }
      isSilentSignInAttempt = false;
      driveAccessToken = tokenResponse.access_token;
      driveSignedIn = true;
      setStoredDriveToken(tokenResponse.access_token, tokenResponse.expires_in || 3600);
      showToast('Signed in with Google');
      updateAuthUI();
      if (document.getElementById('libraryContent')) renderLibraryView();
    },
  });
}

function attemptSilentSignIn() {
  // Check for a still-valid stored token first -- if we have one, this is
  // instant, no network round-trip, no popup, no third-party-cookie
  // dependence at all.
  const stored = getStoredDriveToken();
  if (stored) {
    driveAccessToken = stored;
    driveSignedIn = true;
    updateAuthUI();
    if (document.getElementById('libraryContent')) renderLibraryView();
    return;
  }

  let attempts = 0;
  const maxAttempts = 30;
  const tryInit = () => {
    attempts++;
    if (typeof google !== 'undefined' && google.accounts) {
      initGoogleAuth();
      if (googleTokenClient) {
        isSilentSignInAttempt = true;
        googleTokenClient.requestAccessToken({ prompt: '' });
      }
      return;
    }
    if (attempts < maxAttempts) {
      setTimeout(tryInit, 100);
    }
  };
  tryInit();
}

function signInWithGoogle() {
  if (!googleTokenClient) initGoogleAuth();
  if (googleTokenClient) googleTokenClient.requestAccessToken();
}

function signOutGoogle() {
  if (driveAccessToken && typeof google !== 'undefined') {
    google.accounts.oauth2.revoke(driveAccessToken, () => {});
  }
  driveAccessToken = null;
  driveSignedIn = false;
  clearStoredDriveToken();
  updateAuthUI();
  if (document.getElementById('libraryContent')) renderLibraryView();
}

function updateAuthUI() {
  const el = document.getElementById('authStatus');
  if (!el) return;
  el.innerHTML = driveSignedIn
    ? `<span class="auth-label">Synced to Drive</span><button class="auth-btn" id="signOutBtn">Sign out</button>`
    : `<button class="auth-btn" id="signInBtn">Sign in with Google</button>`;
  const signInBtn = document.getElementById('signInBtn');
  if (signInBtn) signInBtn.addEventListener('click', signInWithGoogle);
  const signOutBtn = document.getElementById('signOutBtn');
  if (signOutBtn) signOutBtn.addEventListener('click', signOutGoogle);
}

async function driveApiFetch(url, options = {}) {
  const resp = await fetch(url, {
    ...options,
    headers: { ...(options.headers || {}), 'Authorization': `Bearer ${driveAccessToken}` },
  });
  if (!resp.ok) {
    const text = await resp.text();
    throw new Error(`Drive API error: HTTP ${resp.status} - ${text}`);
  }
  return resp;
}

async function getChartsIndexFromDrive() {
  const resp = await driveApiFetch(
    'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,appProperties,modifiedTime)&orderBy=modifiedTime desc&pageSize=100'
  );
  const data = await resp.json();
  return (data.files || []).map(f => ({
    id: f.id,
    title: (f.appProperties && f.appProperties.title) || 'Untitled',
    key: (f.appProperties && f.appProperties.key) || '',
    tempo: (f.appProperties && f.appProperties.tempo) || '',
    sectionCount: parseInt((f.appProperties && f.appProperties.sectionCount) || '0', 10),
    updatedAt: new Date(f.modifiedTime).getTime(),
  }));
}

async function saveChartToDrive(data, existingId) {
  const appProperties = {
    title: data.title || 'Untitled',
    key: data.key || '',
    tempo: data.tempo || '',
    sectionCount: String((data.sections || []).length),
  };
  const content = JSON.stringify(data);

  if (existingId) {
    await driveApiFetch(`https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=media`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: content,
    });
    await driveApiFetch(`https://www.googleapis.com/drive/v3/files/${existingId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ appProperties }),
    });
    return existingId;
  }

  const metadata = { name: `chart-${Date.now()}.json`, parents: ['appDataFolder'], appProperties };
  const boundary = 'nashville_chart_boundary_' + Date.now();
  const multipartBody =
    `--${boundary}\r\n` +
    `Content-Type: application/json; charset=UTF-8\r\n\r\n` +
    `${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\n` +
    `Content-Type: application/json\r\n\r\n` +
    `${content}\r\n` +
    `--${boundary}--`;

  const resp = await driveApiFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
    method: 'POST',
    headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
    body: multipartBody,
  });
  const created = await resp.json();
  return created.id;
}

async function loadChartFromDrive(id) {
  const resp = await driveApiFetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
  return await resp.json();
}

async function deleteChartFromDrive(id) {
  await driveApiFetch(`https://www.googleapis.com/drive/v3/files/${id}`, { method: 'DELETE' });
}

async function getChartsIndex() {
  if (driveSignedIn) {
    try { return await getChartsIndexFromDrive(); }
    catch (e) { console.error(e); showToast('Drive error, showing local charts'); }
  }
  try {
    const raw = localStorage.getItem('charts-index');
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

async function saveChartToLibrary(data, existingId) {
  if (driveSignedIn) {
    return await saveChartToDrive(data, existingId);
  }
  const id = existingId || `c${Date.now()}`;
  localStorage.setItem(`chart:${id}`, JSON.stringify(data));
  const index = await getChartsIndex();
  const entry = {
    id,
    title: data.title || 'Untitled',
    key: data.key || '',
    tempo: data.tempo || '',
    sectionCount: (data.sections || []).length,
    updatedAt: Date.now()
  };
  const filtered = index.filter(e => e.id !== id);
  filtered.unshift(entry);
  localStorage.setItem('charts-index', JSON.stringify(filtered));
  return id;
}

  if (driveSignedIn) {
    return await loadChartFromDrive(id);

async function deleteChartFromLibrary(id) {
  if (driveSignedIn) {
    return await deleteChartFromDrive(id);
  }
  try { localStorage.removeItem(`chart:${id}`); } catch (e) {}
  const index = await getChartsIndex();
  const filtered = index.filter(e => e.id !== id);
  localStorage.setItem('charts-index', JSON.stringify(filtered));
}

function renderLoginView(prefillMode) {
  const mode = prefillMode || 'signin'; // 'signin' | 'signup'
  viewContainer.innerHTML = `
    <div class="view login-view">
      <div class="login-panel">
        <div class="login-title">Nashville Chart Book</div>
        <div class="login-subtitle">Sign in to continue</div>
        <div class="field">
          <label for="loginEmail">Email</label>
          <input type="text" id="loginEmail" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••">
        </div>
        <div class="btn-row">
          <button class="shell-btn" id="loginSubmitBtn">${mode === 'signup' ? 'Create Account' : 'Sign In'}</button>
        </div>
        <div class="login-toggle">
          ${mode === 'signup'
            ? `Already have an account? <a href="#" id="toggleToSignin">Sign in</a>`
            : `Need an account? <a href="#" id="toggleToSignup">Create one</a>`}
        </div>
        <div id="loginErrorMsg"></div>
      </div>
    </div>
  `;

  const emailInput = document.getElementById('loginEmail');
  const passwordInput = document.getElementById('loginPassword');
  const submitBtn = document.getElementById('loginSubmitBtn');
  const errorMsg = document.getElementById('loginErrorMsg');

  function showLoginError(msg) { errorMsg.textContent = msg; errorMsg.style.display = 'block'; }

  const toggleLink = document.getElementById(mode === 'signup' ? 'toggleToSignin' : 'toggleToSignup');
  toggleLink.addEventListener('click', (e) => {
    e.preventDefault();
    renderLoginView(mode === 'signup' ? 'signin' : 'signup');
  });

  submitBtn.addEventListener('click', async () => {
    errorMsg.style.display = 'none';
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) { showLoginError('Enter both email and password.'); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = mode === 'signup' ? 'Creating account...' : 'Signing in...';

    try {
      if (mode === 'signup') {
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        if (data.user && !data.session) {
          showLoginError('Account created -- check your email to confirm before signing in.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
          return;
        }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
      // onAuthStateChange handles moving into the app once session is set
    } catch (err) {
      showLoginError(err.message || 'Something went wrong.');
      submitBtn.disabled = false;
      submitBtn.textContent = mode === 'signup' ? 'Create Account' : 'Sign In';
    }
  });
}

    if (!file) return;
    dropZoneText.textContent = file.name;
    processBtnRow.style.display = 'flex';
    clearProcessError();

  audioFileInput.addEventListener('change', () => {

    e.preventDefault();
    dropZone.classList.add('drag-over');
  });
  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('drag-over');
  });
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();

    const file = e.dataTransfer.files[0];
    if (!file) return;
    if (!file.type.startsWith('audio/')) {
      showProcessError('That doesn\'t look like an audio file.');
      return;
    }
    const dt = new DataTransfer();
    dt.items.add(file);
    audioFileInput.files = dt.files;
    setSelectedFile(file);

  processBtn.addEventListener('click', async () => {

    processLog.style.display = 'none';

    let apiKey = null;
