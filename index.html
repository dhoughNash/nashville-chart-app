    processBtn.disabled = true;
    processBtn.style.display = 'none';
    document.getElementById('processingIndicator').style.display = 'flex';

    try {
      const chartData = useManagedMode
        ? await processAudioViaRelay(CHORDS_WORKFLOW_SLUG, SECTIONS_WORKFLOW_SLUG, audioFile, processLogLine)
        : await processAudioWithMusicAi(apiKey, CHORDS_WORKFLOW_SLUG, SECTIONS_WORKFLOW_SLUG, audioFile, processLogLine);
      processLogLine('Saving to library...');
      // Save immediately, before ever showing the chart -- this is the
      // actual fix for charts disappearing: previously the chart only
      // existed in memory until you manually clicked "Save to Library,"
      // so anything that reset the view (losing wifi, an unexpected
      // re-render, closing the tab) lost it for good. Now it's durably
      // saved the moment it's generated, before anything else can happen.
      const newChartId = await saveChartToLibrary(chartData, null);
      processLogLine('Done. Opening chart...');
      currentChartId = newChartId;
      editMode = false;
      activeMarkTool = null;
      renderChartView(chartData);
    } catch (err) {
      processLog.style.display = 'block'; // reveal technical detail so we can actually debug it
      if (err instanceof TypeError && err.message.toLowerCase().includes('fetch')) {
        showProcessError('Request blocked before reaching Music AI. This usually means a network/CORS issue -- try again, or fall back to the Colab pipeline.');
      } else {
        showProcessError('Error: ' + err.message);
      }
    } finally {
      processBtn.disabled = false;
      processBtn.style.display = '';
      document.getElementById('processingIndicator').style.display = 'none';
    }
  });
}

// ---------- chart view (rendering + editing) ----------

// ---------- structural editing: split/merge sections, add bars/sections ----------

// ---------- chord marks (push, stop, dot) and diamond toggling ----------
// Marks are stored separately from the chord's own value, keyed by the
// same path system used for editing -- so applying a mark never touches
// or risks corrupting the actual chord text.

let activeMarkTool = null; // null | 'diamond' | 'push' | 'stop' | 'dot'

function getMarkPathKey(path) {
  return JSON.stringify(path);
}

function getMarksForPath(path) {
  if (!currentData || !currentData.marks) return [];
  return currentData.marks[getMarkPathKey(path)] || [];
}

function toggleMark(path, markType) {
  if (!currentData.marks) currentData.marks = {};
  const key = getMarkPathKey(path);
  const existing = currentData.marks[key] || [];
  const idx = existing.indexOf(markType);
  if (idx === -1) {
    currentData.marks[key] = [...existing, markType];
  } else {
    const updated = existing.filter(m => m !== markType);
    if (updated.length) currentData.marks[key] = updated;
    else delete currentData.marks[key];
  }
  renderChartView(currentData);
}

function wrapWithMarks(path, innerHtml) {
  const marks = getMarksForPath(path);
  if (!marks.length) return innerHtml;
  let decorHtml = '';
  if (marks.includes('stop')) {
    decorHtml += `<svg class="mark-stop" viewBox="0 0 40 40"><polygon points="20,4 36,33 4,33" fill="none" stroke="var(--red)" stroke-width="1.6"/></svg>`;
  }
  if (marks.includes('push')) {
    decorHtml += `<span class="mark-push">&lt;</span>`;
  }
  if (marks.includes('dot')) {
    decorHtml += `<span class="mark-dot"></span>`;
  }
  if (marks.includes('two')) {
    decorHtml += `<span class="mark-beatcount">2</span>`;
  }
  if (marks.includes('six')) {
    decorHtml += `<span class="mark-beatcount">6</span>`;
  }
  if (marks.includes('seventh')) {
    decorHtml += `<span class="mark-seventh">7</span>`;
  }
  if (marks.includes('sus')) {
    decorHtml += `<span class="mark-seventh">S</span>`;
  }
  if (marks.includes('maj7')) {
    decorHtml += `<span class="mark-seventh mark-maj7">M7</span>`;
  }
  if (marks.includes('arrowdown')) {
    decorHtml += `<span class="mark-dynamics">&#8595;</span>`;
  }
  if (marks.includes('arrowup')) {
    decorHtml += `<span class="mark-dynamics">&#8593;</span>`;
  }
  return `<span class="marked-chord">${decorHtml}${innerHtml}</span>`;
}

function getValueAtBarPath(path) {
  // path like ['bar', secIdx, barIdx] (whole bar), or with extra segments:
  // ['group', subIdx] / ['split', subIdx] are PAIRED (an index follows the
  // key), but ['diamond'] / ['box'] are SINGLE (direct property, no index)
  // -- has to branch on which kind each segment is, not assume every
  // segment comes in a pair.
  let node = currentData.sections[path[1]].bars[path[2]];
  const rest = path.slice(3);
  let i = 0;
  while (i < rest.length) {
    const key = rest[i];
    if (key === 'group' || key === 'split') {
      node = node[key][rest[i + 1]];
      i += 2;
    } else {
      node = node[key];
      i += 1;
    }
  }
  return node;
}

function setValueAtBarPath(path, value) {
  const rest = path.slice(3);
  if (rest.length === 0) {
    currentData.sections[path[1]].bars[path[2]] = value;
    return;
  }
  let node = currentData.sections[path[1]].bars[path[2]];
  let i = 0;
  while (i < rest.length) {
    const key = rest[i];
    const isPaired = key === 'group' || key === 'split';
    const stepSize = isPaired ? 2 : 1;
    const isLastStep = i + stepSize >= rest.length;
    if (isLastStep) {
      if (isPaired) node[key][rest[i + 1]] = value;
      else node[key] = value;
      return;
    }
    node = isPaired ? node[key][rest[i + 1]] : node[key];
    i += stepSize;
  }
}

function toggleDiamond(path) {
  // If the click resolved to a path ending in 'diamond', that's pointing at
  // the TEXT inside an existing diamond (the same path editable() uses for
  // contenteditable), not the diamond wrapper itself. Strip it so we
  // toggle the actual wrapper -- otherwise clicking an existing diamond's
  // own number just wraps ANOTHER diamond around it instead of removing
  // the one that's there, and repeated clicks stack up with no way back.
  if (path[path.length - 1] === 'diamond') {
    path = path.slice(0, -1);
  }
  if (path[path.length - 2] === 'split') {
    // A specific half of a diagonal slash chord -- that box is only
    // 20-26px, far too small for a nested diamond to render sensibly.
    // This used to slip through silently and corrupt the chord's data
    // (the renderer only ever expected a plain string there), which is
    // why removing the split bar looked like the only way to fix it.
    showToast("Sustain can't apply to one half of a slash chord -- there's no room for it there.");
    return;
  }
  const val = getValueAtBarPath(path);
  if (typeof val === 'string') {
    setValueAtBarPath(path, { diamond: val });
  } else if (val && val.diamond) {
    setValueAtBarPath(path, val.diamond);
  } else if (val && typeof val.box === 'string') {
    // Nest a diamond inside the existing box (rectangle) rather than
    // rejecting -- the two mark different, compatible things (beat count
    // vs. sustain), so there's no real reason they can't combine.
    setValueAtBarPath(path, { box: { diamond: val.box } });
  } else if (val && val.box && val.box.diamond) {
    // Already nested -- remove just the diamond, keep the box.
    setValueAtBarPath(path, { box: val.box.diamond });
  } else {
    showToast('Sustain only applies to a single chord, not a split or a whole group.');
    return;
  }
  renderChartView(currentData);
}

function toggleBox(path) {
  // A tall rectangle around a chord -- marks a bar as an alternative to the
  // standard 4-beat measure (e.g. a bar of 6, or 2 extra beats). Combine
  // with the "2" or "6" overlay marks to label exactly which.
  // Same reasoning as toggleDiamond above: strip a trailing 'box' segment,
  // since that points at the text inside an existing box, not the box
  // wrapper itself.
  if (path[path.length - 1] === 'box') {
    path = path.slice(0, -1);
  }
  if (path[path.length - 2] === 'split') {
    showToast("Extended bar can't apply to one half of a slash chord -- there's no room for it there.");
    return;
  }
  const val = getValueAtBarPath(path);
  if (typeof val === 'string') {
    setValueAtBarPath(path, { box: val });
  } else if (val && val.box) {
    setValueAtBarPath(path, val.box);
  } else if (val && typeof val.diamond === 'string') {
    // Nest a box inside the existing diamond, same reasoning as above.
    setValueAtBarPath(path, { diamond: { box: val.diamond } });
  } else if (val && val.diamond && val.diamond.box) {
    setValueAtBarPath(path, { diamond: val.diamond.box });
  } else {
    showToast('Extended bar only applies to a single chord, not a split or a whole group.');
    return;
  }
  renderChartView(currentData);
}

function toggleSplitBar(path) {
  // Deliberately {group: [a,b]} (underlined, two sequential chords sharing
  // one bar) -- NOT {split: [a,b]} (the diagonal slash-chord notation for a
  // chord with an altered bass note). Same distinction we established for
  // the automated pipeline; this tool must match it.
  const val = getValueAtBarPath(path);
  if (typeof val === 'string') {
    // starts as the same chord on both sides -- edit the second half by hand
    setValueAtBarPath(path, { group: [val, val] });
  } else if (val && val.group) {
    setValueAtBarPath(path, val.group[0]);
  } else {
    showToast('Split only applies to a single chord, not a sustain or slash chord.');
    return;
  }
  renderChartView(currentData);
}

function getTieKey(secIdx, barIdx) {
  return `${secIdx}-${barIdx}`;
}

function hasTie(secIdx, barIdx) {
  return !!(currentData.ties && currentData.ties[getTieKey(secIdx, barIdx)]);
}

function toggleTie(secIdx, barIdx) {
  const section = currentData.sections[secIdx];
  if (barIdx >= section.bars.length - 1) {
    showToast("Can't tie the last bar in a section to anything.");
    return;
  }
  if (!currentData.ties) currentData.ties = {};
  const key = getTieKey(secIdx, barIdx);
  if (currentData.ties[key]) {
    delete currentData.ties[key];
  } else {
    currentData.ties[key] = true;
  }
  renderChartView(currentData);
}

// A hairpin (crescendo/decrescendo) starts at a given bar and visually
// spans rightward across roughly two bars' width -- it's not tied to
// modifying any specific chord's value, purely a wide overlay, similar in
// spirit to a tie but bigger and independent of bar content.
function getHairpin(secIdx, barIdx) {
  return currentData.hairpins ? currentData.hairpins[getTieKey(secIdx, barIdx)] : null;
}

function toggleHairpin(secIdx, barIdx, type) {
  if (!currentData.hairpins) currentData.hairpins = {};
  const key = getTieKey(secIdx, barIdx);
  if (currentData.hairpins[key] === type) {
    delete currentData.hairpins[key]; // clicking the same type again removes it
  } else {
    currentData.hairpins[key] = type; // set it, or switch from the other type
  }
  renderChartView(currentData);
}

function splitSectionAtBar(secIdx, barIdx) {
  const section = currentData.sections[secIdx];
  if (barIdx <= 0 || barIdx >= section.bars.length) return; // nothing meaningful to split
  const firstPart = section.bars.slice(0, barIdx);
  const secondPart = section.bars.slice(barIdx);
  currentData.sections.splice(secIdx, 1,
    { label: section.label, bars: firstPart },
    { label: 'New', bars: secondPart }
  );
  renderChartView(currentData);
}

function mergeSectionUp(secIdx) {
  if (secIdx <= 0) return;
  const prev = currentData.sections[secIdx - 1];
  const current = currentData.sections[secIdx];
  prev.bars = prev.bars.concat(current.bars);
  currentData.sections.splice(secIdx, 1);
  renderChartView(currentData);
}

function addBarToSection(secIdx) {
  currentData.sections[secIdx].bars.push('1');
  renderChartView(currentData);
}

function insertBarAfter(secIdx, barIdx) {
  // Mirror image of deleteBar's re-indexing: nothing gets dropped since
  // nothing is removed, but everything after the insertion point needs to
  // shift up by one so existing ties/marks keep pointing at the same
  // actual chord they did before.
  const section = currentData.sections[secIdx];
  section.bars.splice(barIdx + 1, 0, '1');

  if (currentData.ties) {
    const newTies = {};
    Object.keys(currentData.ties).forEach((key) => {
      const [tSec, tBar] = key.split('-').map(Number);
      if (tSec !== secIdx) { newTies[key] = currentData.ties[key]; return; }
      const newBar = tBar > barIdx ? tBar + 1 : tBar;
      newTies[`${tSec}-${newBar}`] = currentData.ties[key];
    });
    currentData.ties = newTies;
  }

  if (currentData.marks) {
    const newMarks = {};
    Object.keys(currentData.marks).forEach((key) => {
      const path = JSON.parse(key);
      if (path[0] !== 'bar' || path[1] !== secIdx) { newMarks[key] = currentData.marks[key]; return; }
      const newPath = [...path];
      if (newPath[2] > barIdx) newPath[2] += 1;
      newMarks[JSON.stringify(newPath)] = currentData.marks[key];
    });
    currentData.marks = newMarks;
  }

  renderChartView(currentData);
}

function deleteBar(secIdx, barIdx) {
  // Also clean up any tie or marks anchored to this specific bar (and shift
  // ties on later bars down by one index) so deleting a bar doesn't leave
  // orphaned marks pointing at a now-different bar.
  const section = currentData.sections[secIdx];
  section.bars.splice(barIdx, 1);

  if (currentData.ties) {
    const newTies = {};
    Object.keys(currentData.ties).forEach((key) => {
      const [tSec, tBar] = key.split('-').map(Number);
      if (tSec !== secIdx) { newTies[key] = currentData.ties[key]; return; }
      if (tBar === barIdx) return; // drop the tie that started on the deleted bar
      const newBar = tBar > barIdx ? tBar - 1 : tBar;
      newTies[`${tSec}-${newBar}`] = currentData.ties[key];
    });
    currentData.ties = newTies;
  }

  if (currentData.marks) {
    const newMarks = {};
    Object.keys(currentData.marks).forEach((key) => {
      const path = JSON.parse(key);
      if (path[0] !== 'bar' || path[1] !== secIdx) { newMarks[key] = currentData.marks[key]; return; }
      if (path[2] === barIdx) return; // drop marks that lived on the deleted bar
      const newPath = [...path];
      if (newPath[2] > barIdx) newPath[2] -= 1;
      newMarks[JSON.stringify(newPath)] = currentData.marks[key];
    });
    currentData.marks = newMarks;
  }

  renderChartView(currentData);
}

function addNewSection() {
  currentData.sections.push({ label: 'New', bars: ['1'] });
  renderChartView(currentData);
}

function setAtPath(data, path, value) {
  if (path[0] === 'meta') { data[path[1]] = value; return; }
  if (path[0] === 'label') { data.sections[path[1]].label = value; return; }
  const secIdx = path[1], barIdx = path[2];
  const rest = path.slice(3);
  if (rest.length === 0) { data.sections[secIdx].bars[barIdx] = value; return; }
  let cursor = data.sections[secIdx].bars[barIdx];
  for (let i = 0; i < rest.length; i++) {
    const key = rest[i];
    if (key === 'diamond') { cursor.diamond = value; return; }
    if (key === 'split') {
      const subIdx = rest[i + 1];
      if (i + 2 === rest.length) { cursor.split[subIdx] = value; return; }
      cursor = cursor.split[subIdx]; i++;
    } else if (key === 'group') {
      const subIdx = rest[i + 1];
      if (i + 2 === rest.length) { cursor.group[subIdx] = value; return; }
      cursor = cursor.group[subIdx]; i++;
    }
  }
}

function editable(path, value, locked) {
  if (locked) {
    return `>${value}`;
  }
  return `contenteditable="true" data-path='${JSON.stringify(path)}'>${value}`;
}

function wavyHeaderSVG() {
  return `
    <svg class="header-wave" viewBox="0 0 440 20" preserveAspectRatio="none">
      <path d="M0,10 C80,2 160,16 260,9 C330,4 390,14 440,6"
            fill="none" stroke="var(--brass)" stroke-width="2.5" stroke-linecap="round"/>
    </svg>`;
}

// Renders whatever sits inside a diamond or box: either a plain chord
// numeral, or -- now that the two can nest -- the OTHER shape wrapped
// around that same numeral (a box inside a diamond, or vice versa).
function renderDiamondOrBoxContent(value, path, locked) {
  if (typeof value === 'string') {
    return `<span ${editable(path, displayValueFor(value), locked)}</span>`;
  }
  if (value && value.diamond) {
    const nested = renderDiamondOrBoxContent(value.diamond, [...path, 'diamond'], locked);
    return `
      <span class="bar-diamond bar-shape-nested">
        <svg viewBox="0 0 46 46"><polygon points="23,3 43,23 23,43 3,23" fill="none" stroke="var(--ink)" stroke-width="1.6"/></svg>
        ${nested}
      </span>`;
  }
  if (value && value.box) {
    const nested = renderDiamondOrBoxContent(value.box, [...path, 'box'], locked);
    return `
      <span class="bar-box bar-shape-nested">
        <svg viewBox="0 0 26 40" preserveAspectRatio="none"><rect x="2" y="2" width="22" height="36" rx="2" fill="none" stroke="var(--ink)" stroke-width="1.6"/></svg>
        ${nested}
      </span>`;
  }
  return '';
}

function renderBar(bar, path, inGroup) {
  const locked = displayMode === 'chords' || !editMode;
  if (typeof bar === 'string') {
    // A chord inside a group has to share space with a sibling chord, so
    // in chord-name mode (where names like "Am" are much wider than a
    // plain Nashville digit) it needs to render noticeably smaller than a
    // normal standalone bar -- same reasoning as why the diamond and split
    // box already use their own smaller font.
    const shrink = inGroup && displayMode === 'chords';
    const styleAttr = shrink ? ' style="font-size:19px"' : '';
    const inner = `<span class="bar-single"${styleAttr} ${editable(path, displayValueFor(bar), locked)}</span>`;
    return wrapWithMarks(path, inner);
  }
  if (bar.split) {
    const wide = displayMode === 'chords';
    const boxSize = wide ? 26 : 20;
    const lineMargin = wide ? 3 : 2;
    const lineFar = boxSize - lineMargin;
    return `
      <span class="bar-split${wide ? ' wide' : ''}">
        <svg viewBox="0 0 ${boxSize} ${boxSize}"><line x1="${lineMargin}" y1="${lineFar}" x2="${lineFar}" y2="${lineMargin}" stroke="var(--ink)" stroke-width="1.2" stroke-linecap="round"/></svg>
        <span class="split-top" ${editable([...path, 'split', 0], displayValueFor(bar.split[0]), locked)}</span>
        <span class="split-bottom" ${editable([...path, 'split', 1], displayValueFor(bar.split[1]), locked)}</span>
      </span>`;
  }
  if (bar.diamond) {
    const innerContent = renderDiamondOrBoxContent(bar.diamond, [...path, 'diamond'], locked);
    // A diamond inside a group has to share the group's already-tight
    // width budget with a sibling chord -- at full size, two of these can
    // visually overlap, which makes clicking precisely on the right one
    // unreliable (you can end up hitting the wrong chord's shape
    // entirely). Reuse the same reduced sizing already built for nested
    // diamond/box combinations.
    const inner = `
      <span class="bar-diamond${inGroup ? ' bar-shape-nested' : ''}">
        <svg viewBox="0 0 46 46"><polygon points="23,3 43,23 23,43 3,23" fill="none" stroke="var(--ink)" stroke-width="1.6"/></svg>
        ${innerContent}
      </span>`;
    return wrapWithMarks([...path, 'diamond'], inner);
  }
  if (bar.box) {
    const innerContent = renderDiamondOrBoxContent(bar.box, [...path, 'box'], locked);
    const inner = `
      <span class="bar-box${inGroup ? ' bar-shape-nested' : ''}">
        <svg viewBox="0 0 26 40" preserveAspectRatio="none"><rect x="2" y="2" width="22" height="36" rx="2" fill="none" stroke="var(--ink)" stroke-width="1.6"/></svg>
        ${innerContent}
      </span>`;
    return wrapWithMarks([...path, 'box'], inner);
  }
  if (bar.group) {
    // Chord names are wider than plain numerals, so groups need a bit more
    // breathing room in chords mode regardless of content -- but a group
    // that also contains a split-bar sub-item needs noticeably more
    // compensation than a plain two-chord group does.
    const wide = displayMode === 'chords';
    const containsSplit = bar.group.some(item => item && typeof item === 'object' && item.split);
    const gapPx = wide ? (containsSplit ? 5 : 9) : 14;
    const innerHtml = bar.group.map((item, i) => renderBar(item, [...path, 'group', i], true)).join('');
    return `
      <span class="bar-group" style="gap:${gapPx}px">
        ${innerHtml}
        <svg class="group-underline" viewBox="0 0 100 12" preserveAspectRatio="none">
          <line x1="0" y1="3" x2="100" y2="3" stroke="var(--ink)" stroke-width="1.4"/>
        </svg>
      </span>`;
  }
  return '';
}

function renderSection(section, secIdx) {
  let barsHtml = '';
  section.bars.forEach((bar, i) => {
    const posInLine = i % 8;
    const justify = posInLine < 4 ? 'start' : 'end';
    const splitBtnHtml = editMode
      ? `<button class="bar-split-btn" data-split-sec="${secIdx}" data-split-bar="${i}" title="Split section here">⏎</button>`
      : '';
    const deleteBarBtnHtml = editMode
      ? `<button class="bar-delete-btn" data-delete-bar-sec="${secIdx}" data-delete-bar-idx="${i}" title="Delete this bar">✕</button>`
      : '';
    const insertBarBtnHtml = editMode
      ? `<button class="bar-add-btn" data-insert-bar-sec="${secIdx}" data-insert-bar-idx="${i}" title="Insert a blank bar after this one">+</button>`
      : '';
    const tieHtml = hasTie(secIdx, i)
      ? `<svg class="bar-tie" viewBox="0 0 30 12"><path d="M2,10 Q15,-3 28,10" fill="none" stroke="var(--ink)" stroke-width="1.4"/></svg>`
      : '';
    const hairpinType = getHairpin(secIdx, i);
    const hairpinHtml = hairpinType
      ? `<svg class="bar-hairpin" viewBox="0 0 110 26" preserveAspectRatio="none">${
          hairpinType === 'cresc'
            ? '<path d="M3,13 L106,4 M3,13 L106,22" fill="none" stroke="var(--ink)" stroke-width="1.4"/>'
            : '<path d="M3,4 L106,13 M3,22 L106,13" fill="none" stroke="var(--ink)" stroke-width="1.4"/>'
        }</svg>`
      : '';
    const barPath = ['bar', secIdx, i];
    const rawBarHtml = wrapWithMarks(barPath, renderBar(bar, barPath));
    barsHtml += `
      <span class="bar-wrap" style="justify-self:${justify}" data-bar-path='${JSON.stringify(barPath)}'>
        ${rawBarHtml}
        ${splitBtnHtml}
        ${deleteBarBtnHtml}
        ${insertBarBtnHtml}
        ${tieHtml}
        ${hairpinHtml}
      </span>`;
    if (i % 8 === 3 && i + 1 < section.bars.length) {
      barsHtml += `<span class="group-dot"></span>`;
    }
  });
  const mergeBtnHtml = editMode && secIdx > 0
    ? `<button class="section-ctrl-btn" data-merge-sec="${secIdx}" title="Merge into the previous section">⌃ Merge up</button>`
    : '';
  const addBarBtnHtml = editMode
    ? `<button class="section-ctrl-btn" data-addbar-sec="${secIdx}" title="Add a bar to this section">+ Bar</button>`
    : '';
  const controlsHtml = editMode
    ? `<div class="section-controls">${addBarBtnHtml}${mergeBtnHtml}</div>`
    : '';
  return `
    <div class="section-row">
      <div class="section-label-col">
        <div class="section-label" ${editable(['label', secIdx], section.label, !editMode)}</div>
        ${controlsHtml}
      </div>
      <div class="section-bars">${barsHtml}</div>
    </div>`;
}

function renderChartView(data) {
  currentData = data;
  tabLibrary.classList.remove('active');
  tabNew.classList.remove('active');

  let hintText;
  if (!editMode) {
    hintText = 'Viewing (locked). Click "Edit" to make changes.';
  } else if (displayMode === 'chords') {
    hintText = 'Showing chord names. Switch to Numbers to edit chords directly.';
  } else {
    hintText = 'Click any chord or label to edit it directly.';
  }

  viewContainer.innerHTML = `
    <div class="view no-print-parent">
      <div class="chart-view-toolbar no-print">
        <span class="edit-hint">${hintText}</span>
        <div class="toolbar-actions">
          <button class="shell-btn secondary" id="modeToggleBtn">${displayMode === 'numbers' ? 'Show Chords' : 'Show Numbers'}</button>
          ${editMode ? `<button class="shell-btn secondary" id="fixTonicBtn">Fix Tonic</button>` : ''}
          <button class="shell-btn secondary" id="printBtn">Print / Save PDF</button>
          <button class="shell-btn secondary" id="backBtn">← Library</button>
          <button class="shell-btn${editMode ? '' : ' secondary'}" id="editToggleBtn">${editMode ? 'Done Editing' : 'Edit'}</button>
          <button class="shell-btn" id="saveBtn">Save to Library</button>
        </div>
      </div>
      <div class="fix-tonic-overlay" id="fixTonicOverlay" style="display:none">
        <div class="fix-tonic-panel">
          <div class="fix-tonic-title">Fix Tonic</div>
          <p class="fix-tonic-desc">Enter a Nashville numeral that's currently showing wrong, and what it should actually be. The same correction applies to every chord in the chart.</p>
          <div class="field">
            <label for="fixTonicWrong">Currently showing (wrong)</label>
            <input type="text" id="fixTonicWrong" placeholder="e.g. 2-">
          </div>
          <div class="field">
            <label for="fixTonicCorrect">Should actually be</label>
            <input type="text" id="fixTonicCorrect" placeholder="e.g. 4-">
          </div>
          <div class="btn-row">
            <button class="shell-btn" id="fixTonicApplyBtn">Apply to Whole Chart</button>
            <button class="shell-btn secondary" id="fixTonicCancelBtn">Cancel</button>
          </div>
        </div>
      </div>
      ${editMode ? `
        <div class="tool-palette no-print">
          <button class="tool-btn${activeMarkTool === 'diamond' ? ' active' : ''}" data-tool="diamond" title="Sustain">◇</button>
          <button class="tool-btn${activeMarkTool === 'box' ? ' active' : ''}" data-tool="box" title="Extended bar (e.g. bar of 6)">▯</button>
          <button class="tool-btn${activeMarkTool === 'splitbar' ? ' active' : ''}" data-tool="splitbar" title="Split bar (underlined)">_</button>
          <button class="tool-btn${activeMarkTool === 'push' ? ' active' : ''}" data-tool="push" title="Push (early hit)">&lt;</button>
          <button class="tool-btn${activeMarkTool === 'stop' ? ' active' : ''}" data-tool="stop" title="Stop">△</button>
          <button class="tool-btn${activeMarkTool === 'dot' ? ' active' : ''}" data-tool="dot" title="Single hit">•</button>
          <button class="tool-btn${activeMarkTool === 'two' ? ' active' : ''}" data-tool="two" title="Label as 2 beats">2</button>
          <button class="tool-btn${activeMarkTool === 'six' ? ' active' : ''}" data-tool="six" title="Label as 6 beats">6</button>
          <button class="tool-btn${activeMarkTool === 'seventh' ? ' active' : ''}" data-tool="seventh" title="7th chord">7</button>
          <button class="tool-btn${activeMarkTool === 'sus' ? ' active' : ''}" data-tool="sus" title="Suspended chord">S</button>
          <button class="tool-btn${activeMarkTool === 'maj7' ? ' active' : ''}" data-tool="maj7" title="Major 7th chord" style="font-size:14px">M7</button>
          <button class="tool-btn${activeMarkTool === 'tie' ? ' active' : ''}" data-tool="tie" title="Tie">⌢</button>
          <button class="tool-btn${activeMarkTool === 'cresc' ? ' active' : ''}" data-tool="cresc" title="Crescendo (spans ~2 bars)" style="font-size:13px">Cr</button>
          <button class="tool-btn${activeMarkTool === 'decresc' ? ' active' : ''}" data-tool="decresc" title="Decrescendo (spans ~2 bars)" style="font-size:13px">De</button>
          <button class="tool-btn${activeMarkTool === 'arrowdown' ? ' active' : ''}" data-tool="arrowdown" title="Energy down (start of section)">&#8595;</button>
          <button class="tool-btn${activeMarkTool === 'arrowup' ? ' active' : ''}" data-tool="arrowup" title="Energy up (start of section)">&#8593;</button>
        </div>
      ` : ''}
      <div class="sheet${activeMarkTool ? ' tool-active' : ''}" id="sheet"></div>
    </div>
  `;

  document.getElementById('backBtn').addEventListener('click', () => renderLibraryView());
  document.getElementById('printBtn').addEventListener('click', () => window.print());
  document.getElementById('saveBtn').addEventListener('click', async () => {
    currentChartId = await saveChartToLibrary(currentData, currentChartId);
    showToast('Saved to library');
  });
  document.getElementById('modeToggleBtn').addEventListener('click', () => {
    displayMode = displayMode === 'numbers' ? 'chords' : 'numbers';
    renderChartView(currentData);
  });
  document.getElementById('editToggleBtn').addEventListener('click', () => {
    editMode = !editMode;
    activeMarkTool = null;
    renderChartView(currentData);
  });

  const fixTonicBtn = document.getElementById('fixTonicBtn');
  if (fixTonicBtn) {
    const overlay = document.getElementById('fixTonicOverlay');
    const wrongInput = document.getElementById('fixTonicWrong');
    const correctInput = document.getElementById('fixTonicCorrect');
    fixTonicBtn.addEventListener('click', () => {
      wrongInput.value = '';
      correctInput.value = '';
      overlay.style.display = 'flex';
      wrongInput.focus();
    });
    document.getElementById('fixTonicCancelBtn').addEventListener('click', () => {
      overlay.style.display = 'none';
    });
    document.getElementById('fixTonicApplyBtn').addEventListener('click', () => {
      const wrong = wrongInput.value.trim();
      const correct = correctInput.value.trim();
      if (!wrong || !correct) { showToast('Enter both numerals.'); return; }
      const succeeded = fixTonic(wrong, correct);
      if (succeeded !== false) overlay.style.display = 'none';
    });
  }

  if (editMode) {
    document.querySelectorAll('.tool-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tool = btn.dataset.tool;
        activeMarkTool = activeMarkTool === tool ? null : tool;
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.dataset.tool === activeMarkTool));
        // Hide split/merge/add-bar/add-section entirely while a mark tool is
        // selected -- otherwise those buttons sit right next to the chord
        // you're trying to click and are very easy to hit by accident.
        document.getElementById('sheet').classList.toggle('tool-active', !!activeMarkTool);
      });
    });
  }

  const sheet = document.getElementById('sheet');
  const sectionsHtml = (data.sections || []).map((s, i) => renderSection(s, i)).join('');
  const selectedKey = normalizeKey(data.key);
  sheet.innerHTML = `
    <div class="sheet-header">
      <div class="title-text" ${editable(['meta', 'title'], data.title || 'TITLE', !editMode)}</div>
      ${wavyHeaderSVG()}
      <div class="key-tempo-block">
        <div class="kt-chip">
          <span class="kt-label">Key</span>
          <select class="kt-select" id="keySelect" ${editMode ? '' : 'disabled'}>
            ${CHROMATIC.map(k => `<option value="${k}" ${k === selectedKey ? 'selected' : ''}>${k}</option>`).join('')}
          </select>
        </div>
        <div class="kt-chip"><span class="kt-label">Tempo</span><span class="kt-value" ${editable(['meta', 'tempo'], data.tempo || '—', !editMode)}</span></div>
      </div>
    </div>
    ${sectionsHtml || '<div class="empty-state">No sections in this chart yet.</div>'}
    ${editMode ? '<div class="add-section-row"><button class="add-section-btn" id="addSectionBtn">+ Add Section</button></div>' : ''}
  `;

  document.getElementById('keySelect').addEventListener('change', (e) => {
    currentData.key = e.target.value;
    renderChartView(currentData);
  });

  sheet.addEventListener('click', (e) => {
    const splitBtn = e.target.closest('[data-split-sec]');
    if (splitBtn) {
      splitSectionAtBar(parseInt(splitBtn.dataset.splitSec, 10), parseInt(splitBtn.dataset.splitBar, 10));
      return;
    }
    const deleteBarBtn = e.target.closest('[data-delete-bar-sec]');
    if (deleteBarBtn) {
      deleteBar(parseInt(deleteBarBtn.dataset.deleteBarSec, 10), parseInt(deleteBarBtn.dataset.deleteBarIdx, 10));
      return;
    }
    const insertBarBtn = e.target.closest('[data-insert-bar-sec]');
    if (insertBarBtn) {
      insertBarAfter(parseInt(insertBarBtn.dataset.insertBarSec, 10), parseInt(insertBarBtn.dataset.insertBarIdx, 10));
      return;
    }
    const mergeBtn = e.target.closest('[data-merge-sec]');
    if (mergeBtn) {
      mergeSectionUp(parseInt(mergeBtn.dataset.mergeSec, 10));
      return;
    }
    const addBarBtn = e.target.closest('[data-addbar-sec]');
    if (addBarBtn) {
      addBarToSection(parseInt(addBarBtn.dataset.addbarSec, 10));
      return;
    }
    if (e.target.closest('#addSectionBtn')) {
      addNewSection();
      return;
    }
  });

  sheet.addEventListener('mousedown', (e) => {
    if (!activeMarkTool) return; // no tool selected -- let normal editing happen
    const wrap = e.target.closest('.bar-wrap');
    if (!wrap) return;
    e.preventDefault(); // block the contenteditable focus/cursor from opening
    const basePath = JSON.parse(wrap.getAttribute('data-bar-path'));

    if (activeMarkTool === 'tie') {
      // Ties always connect whole bars to the next whole bar, never
      // individual chords within a group -- always use the base path.
      toggleTie(basePath[1], basePath[2]);
      return;
    }

    if (activeMarkTool === 'cresc' || activeMarkTool === 'decresc') {
      // A hairpin starts at a whole bar and spans rightward, independent
      // of any specific chord within it -- always use the base path.
      toggleHairpin(basePath[1], basePath[2], activeMarkTool === 'cresc' ? 'cresc' : 'decresc');
      return;
    }

    if (activeMarkTool === 'splitbar') {
      // Splitting only makes sense at the whole-bar level -- unlike
      // Sustain, you can't meaningfully split one half of an already-split
      // bar (that would nest a split inside a split). Always use the base
      // path so a second click reliably collapses back to one chord.
      toggleSplitBar(basePath);
      return;
    }

    // For everything else, prefer the most specific chord you actually
    // clicked (e.g. one half of a split-bar group), so marks land exactly
    // where you clicked instead of centering between two chords. Falls
    // back to the whole bar only when the click didn't land on a specific
    // numeral (its outline, the underline, blank space).
    const specific = e.target.closest('[data-path]');
    const path = specific ? JSON.parse(specific.getAttribute('data-path')) : basePath;

    if (activeMarkTool === 'diamond') {
      toggleDiamond(path);
    } else if (activeMarkTool === 'box') {
      toggleBox(path);
    } else {
      toggleMark(path, activeMarkTool);
    }
  });

  sheet.addEventListener('focusout', (e) => {
    const el = e.target;
    if (!el.hasAttribute || !el.hasAttribute('data-path') || !currentData) return;
    const path = JSON.parse(el.getAttribute('data-path'));
    setAtPath(currentData, path, el.textContent.trim());
  });
}

// ---------- auto-condense to one printed page ----------
// @page margins only define the printable area -- they don't shrink content
// that's taller than one page. This measures the actual rendered chart
// height right before printing and scales it down to fit, using `zoom`
// (not `transform`) because zoom genuinely resizes the box in the layout
// engine, which is what the print pagination logic actually reads --
// transform only changes the visual appearance after layout, so it
// wouldn't affect how many pages the browser decides to print.
const PRINT_PAGE_HEIGHT_BUDGET_PX = 820; // conservative estimate for one page at 1in margins
const PRINT_MIN_ZOOM = 0.45; // floor so extremely long charts don't shrink to unreadable

window.addEventListener('beforeprint', () => {
  const sheet = document.getElementById('sheet');
  if (!sheet) return;
  sheet.style.zoom = '1';
  const naturalHeight = sheet.scrollHeight;
  if (naturalHeight > PRINT_PAGE_HEIGHT_BUDGET_PX) {
    const scale = Math.max(PRINT_MIN_ZOOM, PRINT_PAGE_HEIGHT_BUDGET_PX / naturalHeight);
    sheet.style.zoom = String(scale);
  }
});

window.addEventListener('afterprint', () => {
  const sheet = document.getElementById('sheet');
  if (sheet) sheet.style.zoom = '';
});

// ---------- boot ----------

function updateUserStatusUI() {
  const el = document.getElementById('userStatus');
  if (!el) return;
  if (currentUser) {
    const tierLabel = (currentSubscription && currentSubscription.status === 'active' && currentSubscription.tier)
      ? `<span class="user-tier">${currentSubscription.tier.charAt(0).toUpperCase() + currentSubscription.tier.slice(1)}</span>`
      : '';
    el.innerHTML = `<span class="user-email">${currentUser.email}</span>${tierLabel}<button class="auth-btn" id="appSignOutBtn">Log out</button>`;
    document.getElementById('appSignOutBtn').addEventListener('click', signOutOfApp);
  } else {
    el.innerHTML = '';
  }
  // Hide the nav tabs entirely while signed out -- otherwise they'd still
  // be clickable and bypass the login screen.
  document.querySelector('.nav-tabs').style.display = currentUser ? 'flex' : 'none';
}

// onAuthStateChange fires once immediately on subscription with whatever the
// current session state already is, so this single listener handles both
// the initial page-load check and any later sign-in/sign-out.
sb.auth.onAuthStateChange((event, session) => {
  const newUser = session ? session.user : null;
  // Supabase deliberately re-fires this with event type 'SIGNED_IN' on
  // things like refocusing a tab or a background token refresh -- NOT just
  // on a genuine fresh login. Their own docs say not to assume anything
  // from the event name itself. So instead of trusting the event type,
  // check whether this is actually a DIFFERENT person than who was already
  // signed in. Same person re-confirmed -> do nothing, leave whatever
  // they're doing (e.g. mid-chart-processing) completely undisturbed.
  // Genuinely new person -> navigate, same as before.
  const isGenuineNewSignIn = newUser && (!currentUser || currentUser.id !== newUser.id);
  currentUser = newUser;
  updateUserStatusUI();
  if (!currentUser) {
    renderLoginView();
    return;
  }
  updateAuthUI();
  if (isGenuineNewSignIn) {
    attemptSilentSignIn();
    loadSubscriptionStatus().then(() => updateUserStatusUI());
    renderLibraryView();
  }
});
</script>
