<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nashville Chart Book</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    /* shell (binder) tokens */
    --shell-bg: #1B1913;
    --shell-panel: #262319;
    --shell-edge: #3A3627;
    --shell-text: #E8E0CC;
    --shell-text-dim: #948C74;
    --brass: #B8925A;
    --red: #B23A2E;

    /* chart page tokens */
    --paper: #F2ECDA;
    --paper-edge: #E4DCC3;
    --ink: #232838;
    --ink-soft: #4A5064;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--shell-bg);
    background-image: radial-gradient(ellipse at top, rgba(184,146,90,0.07), transparent 55%);
    color: var(--shell-text);
    font-family: 'Public Sans', sans-serif;
  }

  /* --- nav --- */

  .topnav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    border-bottom: 1px solid var(--shell-edge);
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .brand .brand-mark {
    font-family: 'Architects Daughter', cursive;
    font-size: 20px;
    color: var(--brass);
  }

  .nav-tabs { display: flex; gap: 4px; }

  .nav-tab {
    background: transparent;
    border: none;
    color: var(--shell-text-dim);
    font-family: 'Public Sans', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 0.02em;
    padding: 8px 16px;
    border-radius: 5px;
    cursor: pointer;
  }

  .nav-tab:hover { color: var(--shell-text); }

  .nav-tab.active {
    color: var(--shell-bg);
    background: var(--brass);
  }

  .auth-status {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .auth-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--shell-text-dim);
  }

  .auth-btn {
    background: transparent;
    border: 1px solid var(--shell-edge);
    color: var(--shell-text-dim);
    font-family: 'Public Sans', sans-serif;
    font-size: 11.5px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 5px;
    cursor: pointer;
  }
  .auth-btn:hover { color: var(--shell-text); border-color: var(--brass); }

  /* --- shared layout --- */

  .view {
    max-width: 900px;
    margin: 0 auto;
    padding: 36px 24px 64px;
  }

  .view-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .view-header h1 {
    font-family: 'Architects Daughter', cursive;
    font-size: 26px;
    color: var(--shell-text);
    margin: 0;
    font-weight: 400;
  }

  .view-header p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--shell-text-dim);
    margin: 4px 0 0 0;
  }

  button.shell-btn {
    background: var(--brass);
    color: var(--shell-bg);
    border: none;
    border-radius: 5px;
    padding: 9px 16px;
    font-family: 'Public Sans', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.02em;
    cursor: pointer;
  }

  button.shell-btn:hover { filter: brightness(1.1); }

  button.shell-btn.secondary {
    background: transparent;
    color: var(--shell-text-dim);
    border: 1px solid #4A4530;
  }

  /* --- library --- */

  .chart-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }

  .chart-card {
    background: var(--shell-panel);
    border: 1px solid var(--shell-edge);
    border-radius: 8px;
    padding: 18px;
    cursor: pointer;
    transition: border-color 0.15s;
    position: relative;
  }

  .chart-card:hover { border-color: var(--brass); }

  .chart-card .cc-title {
    font-family: 'Architects Daughter', cursive;
    font-size: 19px;
    color: var(--shell-text);
    margin-bottom: 10px;
    padding-right: 20px;
  }

  .chart-card .cc-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--shell-text-dim);
    line-height: 1.8;
  }

  .chart-card .cc-delete {
    position: absolute;
    top: 14px;
    right: 14px;
    color: var(--shell-text-dim);
    background: none;
    border: none;
    font-size: 14px;
    cursor: pointer;
    line-height: 1;
    padding: 2px 5px;
  }

  .chart-card .cc-delete:hover { color: var(--red); }

  .empty-library {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--shell-text-dim);
    text-align: center;
    padding: 60px 20px;
    border: 1px dashed var(--shell-edge);
    border-radius: 8px;
  }

  .empty-library button { margin-top: 14px; }

  /* --- new chart / upload view --- */

  .upload-panel {
    background: var(--shell-panel);
    border: 1px solid var(--shell-edge);
    border-radius: 8px;
    padding: 24px;
    margin-bottom: 18px;
  }

  .upload-panel p {
    font-size: 12px;
    color: var(--shell-text-dim);
    margin: 0 0 14px 0;
    line-height: 1.6;
  }

  .panel-heading {
    font-family: 'Architects Daughter', cursive;
    font-size: 18px;
    color: var(--shell-text);
    margin: 0 0 8px 0;
    font-weight: 400;
  }

  .panel-divider {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--shell-text-dim);
    margin: 4px 0 18px 0;
  }

  .process-log {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    line-height: 1.7;
    color: var(--shell-text-dim);
    max-height: 220px;
    overflow-y: auto;
    margin-top: 12px;
  }

  input[type="text"] {
    width: 100%;
    background: #14130E;
    border: 1px solid var(--shell-edge);
    border-radius: 4px;
    padding: 8px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--shell-text);
  }

  #processErrorMsg {
    color: var(--red);
    font-size: 12px;
    margin-top: 10px;
    display: none;
  }

  .drop-zone {
    position: relative;
    border: 2px dashed var(--shell-edge);
    border-radius: 8px;
    min-height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--brass);
    background: rgba(184, 146, 90, 0.06);
  }
  .drop-zone-text {
    font-family: 'Public Sans', sans-serif;
    font-size: 13px;
    color: var(--shell-text-dim);
    pointer-events: none;
  }
  .drop-zone-input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
  }

  .key-manage-link {
    margin-top: 12px;
    text-align: right;
  }
  .key-manage-link a {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--shell-text-dim);
    text-decoration: none;
  }
  .key-manage-link a:hover { color: var(--brass); }

  .field { margin-bottom: 14px; }

  .field label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--shell-text-dim);
    margin-bottom: 6px;
  }

  input[type="file"] {
    width: 100%;
    background: #14130E;
    border: 1px solid var(--shell-edge);
    border-radius: 4px;
    padding: 8px 10px;
    font-family: 'Public Sans', sans-serif;
    font-size: 12px;
    color: var(--shell-text);
  }

  textarea {
    width: 100%;
    height: 140px;
    background: #14130E;
    border: 1px solid var(--shell-edge);
    border-radius: 4px;
    padding: 10px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--shell-text);
    resize: vertical;
  }

  .btn-row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }

  #errorMsg {
    color: var(--red);
    font-size: 12px;
    margin-top: 10px;
    display: none;
  }

  /* --- chart view --- */

  .chart-view-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 760px;
    margin: 0 auto 14px;
  }

  .edit-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--shell-text-dim);
  }

  .toolbar-actions { display: flex; gap: 8px; }

  [contenteditable="true"] {
    outline: none;
    border-bottom: 1.5px dashed transparent;
    cursor: text;
    transition: border-color 0.15s;
  }
  [contenteditable="true"]:hover { border-bottom-color: var(--brass); }
  [contenteditable="true"]:focus {
    border-bottom-color: var(--red);
    background: rgba(178,58,46,0.06);
  }

  .sheet {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    background: var(--paper);
    border: 1px solid var(--paper-edge);
    box-shadow: 0 4px 22px rgba(0,0,0,0.35);
    padding: 40px 44px 50px;
    color: var(--ink);
  }

  .sheet-header { position: relative; height: 90px; margin-bottom: 34px; }

  .title-text {
    font-family: 'Architects Daughter', cursive;
    font-size: 26px;
    color: var(--ink);
    -webkit-text-stroke: 0.5px var(--ink);
    position: absolute;
    top: 6px;
    left: 0;
  }

  .header-wave { position: absolute; bottom: 0; left: 0; width: 62%; height: 20px; }

  .key-tempo-block {
    position: absolute;
    top: 2px;
    right: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-end;
  }

  .kt-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    padding: 5px 12px;
    min-width: 88px;
    justify-content: space-between;
  }

  .kt-chip .kt-label {
    font-family: 'Public Sans', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .kt-chip .kt-value {
    font-family: 'Architects Daughter', cursive;
    font-size: 15px;
    color: var(--ink);
    -webkit-text-stroke: 0.4px var(--ink);
  }

  .kt-select {
    font-family: 'Architects Daughter', cursive;
    font-size: 15px;
    color: var(--ink);
    -webkit-text-stroke: 0.4px var(--ink);
    background: transparent;
    border: none;
    outline: none;
    cursor: pointer;
  }

  .section-row {
    display: flex;
    align-items: baseline;
    margin-bottom: 30px;
    padding-top: 20px;
  }

  .section-row:first-child {
    padding-top: 0;
  }

  .section-row:not(:first-child) {
    border-top: 1px solid rgba(35, 40, 56, 0.18);
  }

  .section-label {
    font-family: 'Architects Daughter', cursive;
    font-size: 16px;
    color: var(--ink);
    -webkit-text-stroke: 0.4px var(--ink);
    width: 76px;
    flex-shrink: 0;
  }

  .section-bars {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr)) 18px repeat(4, minmax(0, 1fr));
    column-gap: 14px;
    row-gap: 20px;
    align-items: center;
    justify-items: start;
    flex: 1;
    min-width: 0;
    width: 100%;
  }

  .bar-single {
    font-family: 'Architects Daughter', cursive;
    font-size: 24px;
    color: var(--ink);
    -webkit-text-stroke: 0.5px var(--ink);
    line-height: 1;
  }

  .bar-split { position: relative; display: inline-block; width: 20px; height: 20px; }
  .bar-split svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bar-split .split-top, .bar-split .split-bottom {
    position: absolute;
    font-family: 'Architects Daughter', cursive;
    font-size: 10px;
    color: var(--ink);
    -webkit-text-stroke: 0.3px var(--ink);
    line-height: 1;
    white-space: nowrap;
  }
  .bar-split .split-top { top: -1px; left: 0; }
  .bar-split .split-bottom { bottom: -1px; right: 0; }

  /* wider variant for chord-name display (e.g. "A#" needs more room than "1") */
  .bar-split.wide { width: 26px; height: 26px; }
  .bar-split.wide .split-top, .bar-split.wide .split-bottom { font-size: 12px; }
  .bar-split.wide .split-top { top: -2px; left: 0; }
  .bar-split.wide .split-bottom { bottom: -2px; right: 0; }

  .bar-group {
    position: relative;
    display: inline-flex;
    align-items: flex-end;
    gap: 14px;
    padding-bottom: 13px;
  }
  .bar-group.wide { gap: 5px; }
  .bar-group .group-underline { position: absolute; bottom: 0; left: 0; width: 100%; height: 12px; }

  .bar-diamond {
    position: relative;
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bar-diamond svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bar-diamond span { font-family: 'Architects Daughter', cursive; font-size: 17px; color: var(--ink); -webkit-text-stroke: 0.4px var(--ink); position: relative; }

  .group-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--ink); align-self: center; justify-self: center;
  }

  .empty-state {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
    padding: 40px 0;
  }

  .save-toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--brass);
    color: var(--shell-bg);
    font-family: 'Public Sans', sans-serif;
    font-weight: 700;
    font-size: 12.5px;
    padding: 10px 20px;
    border-radius: 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .save-toast.show { opacity: 1; }

  @media (max-width: 560px) {
    .sheet { padding: 28px 20px 36px; }
    .section-row { flex-direction: column; align-items: flex-start; gap: 8px; }
    .section-label { width: auto; }
    .topnav { flex-direction: column; gap: 12px; align-items: flex-start; }
  }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<body>

  <nav class="topnav">
    <div class="brand">
      <span class="brand-mark">Nashville Chart Book</span>
    </div>
    <div class="nav-tabs">
      <button class="nav-tab" id="tabLibrary">Library</button>
      <button class="nav-tab" id="tabNew">New Chart</button>
    </div>
    <div id="authStatus" class="auth-status"></div>
  </nav>

  <div id="viewContainer"></div>

  <div class="save-toast" id="saveToast">Saved to library</div>

<script>
const viewContainer = document.getElementById('viewContainer');
const tabLibrary = document.getElementById('tabLibrary');
const tabNew = document.getElementById('tabNew');
const saveToast = document.getElementById('saveToast');

let currentData = null;      // chart currently open in the chart view
let currentChartId = null;   // storage id of the currently open chart, if it's a saved one

// Workflow slugs are fixed for this account -- no need to expose them as
// editable fields in the UI.
const CHORDS_WORKFLOW_SLUG = 'untitled-workflow-40fd1d9';
const SECTIONS_WORKFLOW_SLUG = 'untitled-workflow-40fe1ea';

// Music AI API key -- saved in localStorage so it's entered once, then
// never shown or re-typed again. Unlike the Google token (deliberately
// memory-only for security), this key is a low-stakes personal-tool
// credential the person explicitly asked to persist.
function getStoredApiKey() {
  try { return localStorage.getItem('musicAiApiKey') || ''; } catch (e) { return ''; }
}
function setStoredApiKey(key) {
  try { localStorage.setItem('musicAiApiKey', key); } catch (e) {}
}
function clearStoredApiKey() {
  try { localStorage.removeItem('musicAiApiKey'); } catch (e) {}
}

// ============================================================
// Ported from nashville.py -- lets the app process audio directly
// via Music AI without needing the Colab notebook at all.
// ============================================================

const MUSICAI_PITCH_CLASSES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const MUSICAI_ENHARMONIC = {"Db":"C#","Eb":"D#","Gb":"F#","Ab":"G#","Bb":"A#","Fb":"E","Cb":"B","E#":"F","B#":"C"};
const MUSICAI_MAJOR_STEPS = [0, 2, 4, 5, 7, 9, 11];
const MUSICAI_MINOR_STEPS = [0, 2, 3, 5, 7, 8, 10];
const MUSICAI_NUMERAL_BY_DEGREE_MAJOR = {0:"1",2:"2",4:"3",5:"4",7:"5",9:"6",11:"7"};
const MUSICAI_NUMERAL_BY_DEGREE_MINOR = {0:"1",2:"2",3:"3",5:"4",7:"5",8:"6",10:"7"};
const MUSICAI_QUALITY_SUFFIX = {
  "maj":"", "maj6":"6", "maj7":"maj7",
  "min":"-", "min6":"-6", "min7":"-7", "minmaj7":"-maj7",
  "dim":"\u00b0", "dim7":"\u00b07", "hdim7":"\u00f87",
  "aug":"+", "7":"7", "sus2":"sus2", "sus4":"sus4",
};

function musicaiNormalizeRoot(root) {
  root = root.trim();
  return MUSICAI_ENHARMONIC[root] || root;
}

function musicaiParseChord(chordName) {
  if (chordName === "N" || chordName === "X") return [null, null];
  let root, quality;
  if (chordName.includes(":")) {
    const idx = chordName.indexOf(":");
    root = chordName.slice(0, idx);
    quality = chordName.slice(idx + 1);
  } else {
    root = chordName; quality = "maj";
  }
  return [musicaiNormalizeRoot(root), quality];
}

function chordToNashvilleNumeral(chordName, keyTonic, keyMode) {
  const [root, quality] = musicaiParseChord(chordName);
  if (root === null) return null;

  const tonicIdx = MUSICAI_PITCH_CLASSES.indexOf(keyTonic);
  const rootIdx = MUSICAI_PITCH_CLASSES.indexOf(root);
  const interval = ((rootIdx - tonicIdx) % 12 + 12) % 12;

  const degreeMap = keyMode === "major" ? MUSICAI_NUMERAL_BY_DEGREE_MAJOR : MUSICAI_NUMERAL_BY_DEGREE_MINOR;
  let numeral, accidental;
  if (degreeMap.hasOwnProperty(interval)) {
    numeral = degreeMap[interval];
    accidental = "";
  } else {
    // Nearest diatonic degree AT OR ABOVE interval, flattened down to reach
    // it -- e.g. bVII in a major key is one semitone below the natural 7th,
    // so we flatten the 7th, not the 6th.
    const steps = keyMode === "major" ? MUSICAI_MAJOR_STEPS : MUSICAI_MINOR_STEPS;
    const candidates = steps.filter(s => s >= interval);
    const upper = candidates.length ? Math.min(...candidates) : steps[steps.length - 1];
    numeral = degreeMap[upper];
    accidental = interval !== upper ? "b" : "";
  }

  const suffix = MUSICAI_QUALITY_SUFFIX.hasOwnProperty(quality) ? MUSICAI_QUALITY_SUFFIX[quality] : quality;
  return `${accidental}${numeral}${suffix}`;
}

function parseMusicAiKeyString(keyString) {
  const parts = keyString.trim().split(/\s+/);
  const tonic = parts.length ? musicaiNormalizeRoot(parts[0]) : "C";
  let mode = parts.length > 1 ? parts[1].toLowerCase() : "major";
  if (mode !== "major" && mode !== "minor") mode = "major";
  return [tonic, mode];
}

function buildBarsFromMusicAiData(chordsData, keyTonic, keyMode) {
  if (!chordsData.length) return [];
  const maxBar = Math.max(...chordsData.map(c => c.end_bar));

  const attacksByBar = {};
  for (const c of chordsData) {
    const rawChord = c.chord_majmin || "N";
    if (rawChord === "N" || rawChord === "X") continue;
    const numeral = chordToNashvilleNumeral(rawChord, keyTonic, keyMode);
    if (numeral === null) continue;
    const barNum = c.start_bar;
    const beatNum = c.start_beat !== undefined ? c.start_beat : 1;
    if (!attacksByBar[barNum]) attacksByBar[barNum] = [];
    attacksByBar[barNum].push({ numeral, beat: beatNum });
  }

  const bars = [];
  let activeNumeral = null;
  for (let barNum = 1; barNum <= maxBar; barNum++) {
    const entries = attacksByBar[barNum] || [];
    if (entries.length) {
      bars.push(entries);
      activeNumeral = entries[entries.length - 1].numeral;
    } else if (activeNumeral !== null) {
      bars.push([{ numeral: activeNumeral, beat: 1 }]);
    } else {
      bars.push([{ numeral: "N.C.", beat: 1 }]);
    }
  }
  return bars;
}

function musicaiBarToShorthand(barEntries) {
  // Deliberately {group: [a,b]} (underline), NOT {split: [a,b]} (diagonal) --
  // diagonal is reserved for slash chords (a chord with an altered bass
  // note), a different musical concept from two sequential chords in one bar.
  if (barEntries.length === 1) return barEntries[0].numeral;
  return { group: [barEntries[0].numeral, barEntries[barEntries.length - 1].numeral] };
}

function musicaiGetDownbeats(beats) {
  let downbeats = beats.filter(([t, b]) => b === 1.0).map(([t]) => t);
  if (!downbeats.length && beats.length) downbeats = [beats[0][0]];
  return downbeats;
}

const MUSICAI_LABEL_ABBREVIATIONS = {
  "start": null, "end": null,
  "intro": "Intro", "verse": "V", "chorus": "CH",
  "prechorus": "PC", "pre-chorus": "PC", "bridge": "B",
  "outro": "Outro", "solo": "Solo", "instrumental": "Inst", "breakdown": "BD",
};

function assignMusicAiSections(bars, downbeats, segments) {
  function labelForTime(t) {
    for (const seg of segments) {
      if (seg.start <= t && t < seg.end) {
        const raw = seg.label.toLowerCase().trim();
        if (MUSICAI_LABEL_ABBREVIATIONS.hasOwnProperty(raw)) return MUSICAI_LABEL_ABBREVIATIONS[raw];
        return raw.charAt(0).toUpperCase() + raw.slice(1);
      }
    }
    return null;
  }

  const rawLabels = downbeats.slice(0, bars.length).map(labelForTime);

  const sections = [];
  const counts = {};
  let currentLabel = null;
  let currentBars = [];

  function flush() {
    if (currentLabel === null || !currentBars.length) return;
    let displayLabel;
    if (["Intro", "Outro", "Solo", "Inst", "BD"].includes(currentLabel)) {
      displayLabel = currentLabel;
    } else {
      counts[currentLabel] = (counts[currentLabel] || 0) + 1;
      displayLabel = `${currentLabel}${counts[currentLabel]}`;
    }
    sections.push({ label: displayLabel, bars: currentBars });
    currentBars = [];
  }

  for (let i = 0; i < bars.length; i++) {
    const label = rawLabels[i];
    if (label === null) {
      flush();
      currentLabel = null;
      continue;
    }
    if (label !== currentLabel) {
      flush();
      currentLabel = label;
    }
    currentBars.push(musicaiBarToShorthand(bars[i]));
  }
  flush();

  return sections;
}

async function musicaiPollAndGetResult(jobId, apiKey, logFn) {
  const maxAttempts = 80; // ~4 minutes
  for (let i = 0; i < maxAttempts; i++) {
    await new Promise(r => setTimeout(r, 3000));
    const resp = await fetch(`https://api.music.ai/v1/job/${jobId}/status`, { headers: { 'Authorization': apiKey } });
    if (!resp.ok) throw new Error(`Status check failed: HTTP ${resp.status}`);
    const data = await resp.json();
    logFn(`  [${(i + 1) * 3}s] status: ${data.status}`);
    if (data.status === 'SUCCEEDED') {
      const finalResp = await fetch(`https://api.music.ai/v1/job/${jobId}`, { headers: { 'Authorization': apiKey } });
      if (!finalResp.ok) throw new Error(`Fetching job result failed: HTTP ${finalResp.status}`);
      const finalData = await finalResp.json();
      return finalData.result;
    }
    if (data.status === 'FAILED') throw new Error('Job failed on Music AI\'s side.');
  }
  throw new Error('Timed out waiting for job to complete.');
}

async function musicaiUploadFile(apiKey, file, logFn) {
  const uploadUrlResp = await fetch('https://api.music.ai/v1/upload', { headers: { 'Authorization': apiKey } });
  if (!uploadUrlResp.ok) {
    const text = await uploadUrlResp.text();
    throw new Error(`Getting upload URL failed: HTTP ${uploadUrlResp.status} - ${text}`);
  }
  const { uploadUrl, downloadUrl } = await uploadUrlResp.json();
  const putResp = await fetch(uploadUrl, { method: 'PUT', body: file });
  if (!putResp.ok) throw new Error(`File upload failed: HTTP ${putResp.status}`);
  return downloadUrl;
}

async function processAudioWithMusicAi(apiKey, chordsWorkflowSlug, sectionsWorkflowSlug, file, logFn) {
  logFn('Uploading audio for chords & beats job...');
  const downloadUrl = await musicaiUploadFile(apiKey, file, logFn);

  logFn('Submitting chords & beats job...');
  const chordsJobResp = await fetch('https://api.music.ai/v1/job', {
    method: 'POST',
    headers: { 'Authorization': apiKey, 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: 'Nashville chart', workflow: chordsWorkflowSlug, params: { inputUrl: downloadUrl } })
  });
  if (!chordsJobResp.ok) {
    const text = await chordsJobResp.text();
    throw new Error(`Chords job submission failed: HTTP ${chordsJobResp.status} - ${text}`);
  }
  const chordsJob = await chordsJobResp.json();
  logFn(`Chords job submitted: ${chordsJob.id}. Waiting...`);

  const chordsResult = await musicaiPollAndGetResult(chordsJob.id, apiKey, logFn);
  const bpm = chordsResult.bpm;
  const keyString = chordsResult['root key'] || 'C major';
  logFn(`Key: ${keyString}, BPM: ${bpm}`);

  const chordsData = await (await fetch(chordsResult['chords map'])).json();
  logFn(`Got ${chordsData.length} chord segments.`);

  const beatsRaw = await (await fetch(chordsResult['beat map'])).json();
  const beatsList = beatsRaw.map(b => [b.time, b.beatNum]);
  const downbeats = musicaiGetDownbeats(beatsList);
  logFn(`Got ${downbeats.length} downbeats.`);

  let sectionsData = null;
  if (sectionsWorkflowSlug) {
    try {
      logFn('Re-uploading for sections job (upload URLs are one-time-use)...');
      const downloadUrl2 = await musicaiUploadFile(apiKey, file, logFn);
      logFn('Submitting sections job...');
      const sectionsJobResp = await fetch('https://api.music.ai/v1/job', {
        method: 'POST',
        headers: { 'Authorization': apiKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: 'Nashville chart - sections', workflow: sectionsWorkflowSlug, params: { inputUrl: downloadUrl2 } })
      });
      if (!sectionsJobResp.ok) throw new Error(`HTTP ${sectionsJobResp.status}`);
      const sectionsJob = await sectionsJobResp.json();
      const sectionsResult = await musicaiPollAndGetResult(sectionsJob.id, apiKey, logFn);
      sectionsData = await (await fetch(sectionsResult.sections)).json();
      logFn(`Got ${sectionsData.length} structural segments.`);
    } catch (err) {
      logFn(`Sections detection failed (${err.message}) -- continuing with one "Song" section.`);
      sectionsData = null;
    }
  }

  const [keyTonic, keyMode] = parseMusicAiKeyString(keyString);
  const bars = buildBarsFromMusicAiData(chordsData, keyTonic, keyMode);
  logFn(`Built ${bars.length} bars.`);

  const sections = sectionsData
    ? assignMusicAiSections(bars, downbeats, sectionsData)
    : [{ label: 'Song', bars: bars.map(musicaiBarToShorthand) }];

  return {
    title: file.name.replace(/\.[^/.]+$/, ''),
    key: keyTonic,
    tempo: bpm ? String(bpm) : '',
    sections,
  };
}
let displayMode = 'numbers'; // 'numbers' | 'chords' -- purely a display transform, never mutates currentData

const CHROMATIC = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const FLAT_TO_SHARP = { Db: 'C#', Eb: 'D#', Gb: 'F#', Ab: 'G#', Bb: 'A#' };

// Nashville-number suffix -> conventional chord-name suffix (e.g. "-7" -> "m7").
// Anything not in this map is passed through unchanged as a reasonable fallback.
const NASHVILLE_SUFFIX_TO_CHORD = {
  '': '', '-': 'm', '-6': 'm6', '-7': 'm7', '-maj7': 'm(maj7)',
  'maj7': 'maj7', '6': '6', '7': '7', 'sus2': 'sus2', 'sus4': 'sus4',
  '+': '+', '°': 'dim', '°7': 'dim7', 'ø7': 'm7b5'
};

// Matches whatever's stored in data.key (e.g. "A#", "G major", "Bb") to one
// of the 12 canonical chromatic (sharp) spellings the dropdown/converter use.
function normalizeKey(raw) {
  if (!raw) return 'C';
  const first = raw.trim().split(/\s+/)[0];
  const normalized = FLAT_TO_SHARP[first] || first;
  return CHROMATIC.includes(normalized) ? normalized : 'C';
}

// Converts a Nashville numeral (e.g. "6-", "b7", "1sus4") into an actual chord
// name (e.g. "Em", "F", "Gsus4") relative to keyRoot. Numbers are always
// interpreted against the major scale, per standard Nashville Number System
// convention -- quality (major/minor/etc.) comes from the numeral's own
// suffix, not from the key's mode.
function numberToChordName(numeral, keyRoot) {
  // Handle a manually-typed slash chord (e.g. "2-/5" for "2 minor over a 5
  // bass note") by converting each side independently and rejoining --
  // this is a general fallback, not true bass-note detection from Music AI
  // (which doesn't currently give us that data), but it means you can type
  // your own bass note and have both halves convert to real note names.
  if (numeral.includes('/')) {
    const slashIdx = numeral.indexOf('/');
    const mainPart = numeral.slice(0, slashIdx);
    const bassPart = numeral.slice(slashIdx + 1);
    return `${numberToChordName(mainPart, keyRoot)}/${numberToChordName(bassPart, keyRoot)}`;
  }

  const rootIdx = CHROMATIC.indexOf(normalizeKey(keyRoot));
  const m = numeral.match(/^([b#]?)([1-7])(.*)$/);
  if (!m) return numeral; // can't parse (shouldn't normally happen) -- show as-is
  const [, accidental, digit, suffix] = m;
  const majorSteps = { 1: 0, 2: 2, 3: 4, 4: 5, 5: 7, 6: 9, 7: 11 };
  let semitone = majorSteps[digit];
  if (accidental === 'b') semitone -= 1;
  if (accidental === '#') semitone += 1;
  semitone = ((semitone % 12) + 12) % 12;
  const chordRoot = CHROMATIC[(rootIdx + semitone) % 12];
  const chordSuffix = NASHVILLE_SUFFIX_TO_CHORD.hasOwnProperty(suffix) ? NASHVILLE_SUFFIX_TO_CHORD[suffix] : suffix;
  return chordRoot + chordSuffix;
}

function displayValueFor(raw) {
  if (displayMode !== 'chords' || raw === '%') return raw;
  return numberToChordName(raw, currentData.key);
}

// ---------- Google Drive sign-in ----------
// Uses the Drive "appDataFolder" -- a hidden folder scoped to just this app,
// so charts never clutter the person's regular visible Drive. Falls back to
// localStorage automatically when not signed in.

const GOOGLE_CLIENT_ID = '451996104682-kj3dmo065dt1e4jh8to95j3etj473g6q.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';

let driveAccessToken = null; // session-only, in-memory -- never persisted
let driveSignedIn = false;
let googleTokenClient = null;

let isSilentSignInAttempt = false;

function initGoogleAuth() {
  if (googleTokenClient || typeof google === 'undefined') return;
  googleTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: (tokenResponse) => {
      if (tokenResponse.error) {
        // A silent attempt failing is completely normal (first-time visitor,
        // no prior consent, or session expired) -- stay quiet about it.
        // Only surface an error when the person explicitly clicked the button.
        if (!isSilentSignInAttempt) {
          showToast('Google sign-in failed: ' + tokenResponse.error);
        }
        isSilentSignInAttempt = false;
        return;
      }
      isSilentSignInAttempt = false;
      driveAccessToken = tokenResponse.access_token;
      driveSignedIn = true;
      showToast('Signed in with Google');
      updateAuthUI();
      if (document.getElementById('libraryContent')) renderLibraryView();
    },
  });
}

function attemptSilentSignIn() {
  let attempts = 0;
  const maxAttempts = 30; // ~3 seconds, waiting for the GSI script to load
  const tryInit = () => {
    attempts++;
    if (typeof google !== 'undefined' && google.accounts) {
      initGoogleAuth();
      if (googleTokenClient) {
        isSilentSignInAttempt = true;
        // prompt: '' asks Google to skip the consent UI entirely if the
        // person already granted access before and is still logged into
        // Google in this browser -- otherwise it just fails quietly.
        googleTokenClient.requestAccessToken({ prompt: '' });
      }
      return;
    }
    if (attempts < maxAttempts) {
      setTimeout(tryInit, 100);
    }
    // if the library never loads, just leave the manual "Sign in" button as the fallback
  };
  tryInit();
}

function signInWithGoogle() {
  if (!googleTokenClient) initGoogleAuth();
  if (googleTokenClient) googleTokenClient.requestAccessToken();
}

function signOutGoogle() {
  if (driveAccessToken && typeof google !== 'undefined') {
    google.accounts.oauth2.revoke(driveAccessToken, () => {});
  }
  driveAccessToken = null;
  driveSignedIn = false;
  updateAuthUI();
  if (document.getElementById('libraryContent')) renderLibraryView();
}

function updateAuthUI() {
  const el = document.getElementById('authStatus');
  if (!el) return;
  el.innerHTML = driveSignedIn
    ? `<span class="auth-label">Synced to Drive</span><button class="auth-btn" id="signOutBtn">Sign out</button>`
    : `<button class="auth-btn" id="signInBtn">Sign in with Google</button>`;
  const signInBtn = document.getElementById('signInBtn');
  if (signInBtn) signInBtn.addEventListener('click', signInWithGoogle);
  const signOutBtn = document.getElementById('signOutBtn');
  if (signOutBtn) signOutBtn.addEventListener('click', signOutGoogle);
}

async function driveApiFetch(url, options = {}) {
  const resp = await fetch(url, {
    ...options,
    headers: { ...(options.headers || {}), 'Authorization': `Bearer ${driveAccessToken}` },
  });
  if (!resp.ok) {
    const text = await resp.text();
    throw new Error(`Drive API error: HTTP ${resp.status} - ${text}`);
  }
  return resp;
}

async function getChartsIndexFromDrive() {
  const resp = await driveApiFetch(
    'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,appProperties,modifiedTime)&orderBy=modifiedTime desc&pageSize=100'
  );
  const data = await resp.json();
  return (data.files || []).map(f => ({
    id: f.id,
    title: (f.appProperties && f.appProperties.title) || 'Untitled',
    key: (f.appProperties && f.appProperties.key) || '',
    tempo: (f.appProperties && f.appProperties.tempo) || '',
    sectionCount: parseInt((f.appProperties && f.appProperties.sectionCount) || '0', 10),
    updatedAt: new Date(f.modifiedTime).getTime(),
  }));
}

async function saveChartToDrive(data, existingId) {
  const appProperties = {
    title: data.title || 'Untitled',
    key: data.key || '',
    tempo: data.tempo || '',
    sectionCount: String((data.sections || []).length),
  };
  const content = JSON.stringify(data);

  if (existingId) {
    await driveApiFetch(`https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=media`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: content,
    });
    await driveApiFetch(`https://www.googleapis.com/drive/v3/files/${existingId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ appProperties }),
    });
    return existingId;
  }

  const metadata = { name: `chart-${Date.now()}.json`, parents: ['appDataFolder'], appProperties };
  const boundary = 'nashville_chart_boundary_' + Date.now();
  const multipartBody =
    `--${boundary}\r\n` +
    `Content-Type: application/json; charset=UTF-8\r\n\r\n` +
    `${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\n` +
    `Content-Type: application/json\r\n\r\n` +
    `${content}\r\n` +
    `--${boundary}--`;

  const resp = await driveApiFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
    method: 'POST',
    headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
    body: multipartBody,
  });
  const created = await resp.json();
  return created.id;
}

async function loadChartFromDrive(id) {
  const resp = await driveApiFetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
  return await resp.json();
}

async function deleteChartFromDrive(id) {
  await driveApiFetch(`https://www.googleapis.com/drive/v3/files/${id}`, { method: 'DELETE' });
}

// ---------- persistent storage helpers ----------
// Index: "charts-index" -> array of {id, title, key, tempo, sectionCount, updatedAt}
// Each chart's full data: "chart:<id>" -> the chart JSON
//
// Uses localStorage -- a standard browser feature that works on any real
// website (unlike window.storage, which only exists inside Claude's own
// artifact preview and would silently fail once deployed standalone).
// Trade-off: this is per-browser/per-device, not synced across devices.
// A future Google Drive integration can layer on top of these same function
// signatures without touching any of the calling code elsewhere in the app.

async function getChartsIndex() {
  if (driveSignedIn) {
    try { return await getChartsIndexFromDrive(); }
    catch (e) { console.error(e); showToast('Drive error, showing local charts'); }
  }
  try {
    const raw = localStorage.getItem('charts-index');
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

async function saveChartToLibrary(data, existingId) {
  if (driveSignedIn) {
    return await saveChartToDrive(data, existingId);
  }
  const id = existingId || `c${Date.now()}`;
  localStorage.setItem(`chart:${id}`, JSON.stringify(data));
  const index = await getChartsIndex();
  const entry = {
    id,
    title: data.title || 'Untitled',
    key: data.key || '',
    tempo: data.tempo || '',
    sectionCount: (data.sections || []).length,
    updatedAt: Date.now()
  };
  const filtered = index.filter(e => e.id !== id);
  filtered.unshift(entry);
  localStorage.setItem('charts-index', JSON.stringify(filtered));
  return id;
}

async function loadChartFromLibrary(id) {
  if (driveSignedIn) {
    return await loadChartFromDrive(id);
  }
  const raw = localStorage.getItem(`chart:${id}`);
  return raw ? JSON.parse(raw) : null;
}

async function deleteChartFromLibrary(id) {
  if (driveSignedIn) {
    return await deleteChartFromDrive(id);
  }
  try { localStorage.removeItem(`chart:${id}`); } catch (e) {}
  const index = await getChartsIndex();
  const filtered = index.filter(e => e.id !== id);
  localStorage.setItem('charts-index', JSON.stringify(filtered));
}

      currentChartId = null;
      renderChartView(data);
    };
    reader.onerror = () => showError(`Couldn't read "${file.name}".`);
    reader.readAsText(file);
  });

  // --- direct audio processing panel ---
  const processBtn = document.getElementById('processBtn');
  const processBtnRow = document.getElementById('processBtnRow');
  const processLog = document.getElementById('processLog');
  const processErrorMsg = document.getElementById('processErrorMsg');
  const apiKeySetup = document.getElementById('apiKeySetup');
  const musicAiKeySetupInput = document.getElementById('musicAiKeySetup');
  const saveKeyBtn = document.getElementById('saveKeyBtn');
  const dropZone = document.getElementById('dropZone');
  const dropZoneText = document.getElementById('dropZoneText');
  const audioFileInput = document.getElementById('processAudioFile');
  const keyManageLink = document.getElementById('keyManageLink');
  const changeKeyLink = document.getElementById('changeKeyLink');

  function processLogLine(msg) {
    const line = document.createElement('div');
    line.textContent = msg;
    processLog.appendChild(line);
    processLog.scrollTop = processLog.scrollHeight;
  }
  function showProcessError(msg) { processErrorMsg.textContent = msg; processErrorMsg.style.display = 'block'; }
  function clearProcessError() { processErrorMsg.style.display = 'none'; }

  function showKeySetup() {
    apiKeySetup.style.display = 'block';
    dropZone.style.display = 'none';
    processBtnRow.style.display = 'none';
    keyManageLink.style.display = 'none';
  }
  function showDropZone() {
    apiKeySetup.style.display = 'none';
    dropZone.style.display = 'flex';
    keyManageLink.style.display = 'block';
  }

  saveKeyBtn.addEventListener('click', () => {
    const key = musicAiKeySetupInput.value.trim();
    if (!key) return;
    setStoredApiKey(key);
    musicAiKeySetupInput.value = '';
    showDropZone();
  });

  changeKeyLink.addEventListener('click', (e) => {
    e.preventDefault();
    showKeySetup();
  });

  function setSelectedFile(file) {
    if (!file) return;
    dropZoneText.textContent = file.name;
    processBtnRow.style.display = 'flex';
    clearProcessError();
  }

  audioFileInput.addEventListener('change', () => {
    setSelectedFile(audioFileInput.files[0]);
  });

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('drag-over');
  });
  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('drag-over');
  });
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (!file) return;
    if (!file.type.startsWith('audio/')) {
      showProcessError('That doesn\'t look like an audio file.');
      return;
    }
    // reflect the dropped file into the real file input so the same
    // "read the file input" logic works regardless of drop vs click
    const dt = new DataTransfer();
    dt.items.add(file);
    audioFileInput.files = dt.files;
    setSelectedFile(file);
  });

  processBtn.addEventListener('click', async () => {
    clearProcessError();
    processLog.innerHTML = '';

    const apiKey = getStoredApiKey();
    const audioFile = audioFileInput.files[0];

    if (!apiKey) { showKeySetup(); showProcessError('Enter your Music AI API key first.'); return; }
    if (!audioFile) { showProcessError('Choose an audio file first.'); return; }

    processBtn.disabled = true;
    processBtn.textContent = 'Processing...';

    try {
      const chartData = await processAudioWithMusicAi(
        apiKey, CHORDS_WORKFLOW_SLUG, SECTIONS_WORKFLOW_SLUG, audioFile, processLogLine
      );
      processLogLine('Done. Opening chart...');
      currentChartId = null;
      renderChartView(chartData);
    } catch (err) {
      if (err instanceof TypeError && err.message.toLowerCase().includes('fetch')) {
        showProcessError('Request blocked before reaching Music AI. This usually means a network/CORS issue -- try again, or fall back to the Colab pipeline.');
      } else {
        showProcessError('Error: ' + err.message);
      }
    } finally {
      processBtn.disabled = false;
      processBtn.textContent = 'Process & Open Chart';
    }
  });
}

// ---------- chart view (rendering + editing) ----------

function setAtPath(data, path, value) {
  if (path[0] === 'meta') { data[path[1]] = value; return; }
  if (path[0] === 'label') { data.sections[path[1]].label = value; return; }
  const secIdx = path[1], barIdx = path[2];
  const rest = path.slice(3);
  if (rest.length === 0) { data.sections[secIdx].bars[barIdx] = value; return; }
  let cursor = data.sections[secIdx].bars[barIdx];
  for (let i = 0; i < rest.length; i++) {
    const key = rest[i];
    if (key === 'diamond') { cursor.diamond = value; return; }
    if (key === 'split') {
      const subIdx = rest[i + 1];
      if (i + 2 === rest.length) { cursor.split[subIdx] = value; return; }
      cursor = cursor.split[subIdx]; i++;
    } else if (key === 'group') {
      const subIdx = rest[i + 1];
      if (i + 2 === rest.length) { cursor.group[subIdx] = value; return; }
      cursor = cursor.group[subIdx]; i++;
    }
  }
}

function editable(path, value, locked) {
  if (locked) {
    return `>${value}`; // no contenteditable, no data-path -- purely display-only
  }
  return `contenteditable="true" data-path='${JSON.stringify(path)}'>${value}`;
}

function wavyHeaderSVG() {
  return `
    <svg class="header-wave" viewBox="0 0 440 20" preserveAspectRatio="none">
      <path d="M0,10 C80,2 160,16 260,9 C330,4 390,14 440,6"
            fill="none" stroke="var(--brass)" stroke-width="2.5" stroke-linecap="round"/>
    </svg>`;
}

function renderBar(bar, path) {
  const locked = displayMode === 'chords';
  if (typeof bar === 'string') {
    return `<span class="bar-single" ${editable(path, displayValueFor(bar), locked)}</span>`;
  }
  if (bar.split) {
    const wide = displayMode === 'chords';
    const boxSize = wide ? 26 : 20;
    const lineMargin = wide ? 3 : 2;
    const lineFar = boxSize - lineMargin;
    return `
      <span class="bar-split${wide ? ' wide' : ''}">
        <svg viewBox="0 0 ${boxSize} ${boxSize}"><line x1="${lineMargin}" y1="${lineFar}" x2="${lineFar}" y2="${lineMargin}" stroke="var(--ink)" stroke-width="1.2" stroke-linecap="round"/></svg>
        <span class="split-top" ${editable([...path, 'split', 0], displayValueFor(bar.split[0]), locked)}</span>
        <span class="split-bottom" ${editable([...path, 'split', 1], displayValueFor(bar.split[1]), locked)}</span>
      </span>`;
  }
  if (bar.diamond) {
    return `
      <span class="bar-diamond">
        <svg viewBox="0 0 46 46"><polygon points="23,3 43,23 23,43 3,23" fill="none" stroke="var(--ink)" stroke-width="1.6"/></svg>
        <span ${editable([...path, 'diamond'], displayValueFor(bar.diamond), locked)}</span>
      </span>`;
  }
  if (bar.group) {
    const wide = displayMode === 'chords';
    const innerHtml = bar.group.map((item, i) => renderBar(item, [...path, 'group', i])).join('');
    return `
      <span class="bar-group${wide ? ' wide' : ''}">
        ${innerHtml}
        <svg class="group-underline" viewBox="0 0 100 12" preserveAspectRatio="none">
          <line x1="0" y1="3" x2="100" y2="3" stroke="var(--ink)" stroke-width="1.4"/>
        </svg>
      </span>`;
  }
  return '';
}

function renderSection(section, secIdx) {
  let barsHtml = '';
  section.bars.forEach((bar, i) => {
    // First 4 bars of each 8-bar line hug the left edge of their column,
    // the last 4 hug the right edge -- so the whole line reads as two
    // groups anchored outward from the centered dot, not floating loosely.
    const posInLine = i % 8;
    const justify = posInLine < 4 ? 'start' : 'end';
    barsHtml += `<span style="justify-self:${justify}">${renderBar(bar, ['bar', secIdx, i])}</span>`;
    if (i % 8 === 3 && i + 1 < section.bars.length) {
      barsHtml += `<span class="group-dot"></span>`;
    }
  });
  return `
    <div class="section-row">
      <div class="section-label" ${editable(['label', secIdx], section.label)}</div>
      <div class="section-bars">${barsHtml}</div>
    </div>`;
}

function renderChartView(data) {
  currentData = data;
  tabLibrary.classList.remove('active');
  tabNew.classList.remove('active');

  const hintText = displayMode === 'chords'
    ? 'Showing chord names. Switch to Numbers to edit chords directly.'
    : 'Click any chord or label to edit it directly.';

  viewContainer.innerHTML = `
    <div class="view">
      <div class="chart-view-toolbar">
        <span class="edit-hint">${hintText}</span>
        <div class="toolbar-actions">
          <button class="shell-btn secondary" id="modeToggleBtn">${displayMode === 'numbers' ? 'Show Chords' : 'Show Numbers'}</button>
          <button class="shell-btn secondary" id="backBtn">← Library</button>
          <button class="shell-btn" id="saveBtn">Save to Library</button>
        </div>
      </div>
      <div class="sheet" id="sheet"></div>
    </div>
  `;

  document.getElementById('backBtn').addEventListener('click', () => renderLibraryView());
  document.getElementById('saveBtn').addEventListener('click', async () => {
    currentChartId = await saveChartToLibrary(currentData, currentChartId);
    showToast('Saved to library');
  });
  document.getElementById('modeToggleBtn').addEventListener('click', () => {
    displayMode = displayMode === 'numbers' ? 'chords' : 'numbers';
    renderChartView(currentData);
  });

  const sheet = document.getElementById('sheet');
  const sectionsHtml = (data.sections || []).map((s, i) => renderSection(s, i)).join('');
  const selectedKey = normalizeKey(data.key);
  sheet.innerHTML = `
    <div class="sheet-header">
      <div class="title-text" ${editable(['meta', 'title'], data.title || 'TITLE')}</div>
      ${wavyHeaderSVG()}
      <div class="key-tempo-block">
        <div class="kt-chip">
          <span class="kt-label">Key</span>
          <select class="kt-select" id="keySelect">
            ${CHROMATIC.map(k => `<option value="${k}" ${k === selectedKey ? 'selected' : ''}>${k}</option>`).join('')}
          </select>
        </div>
        <div class="kt-chip"><span class="kt-label">Tempo</span><span class="kt-value" ${editable(['meta', 'tempo'], data.tempo || '—')}</span></div>
      </div>
    </div>
    ${sectionsHtml || '<div class="empty-state">No sections in this chart yet.</div>'}
  `;

  document.getElementById('keySelect').addEventListener('change', (e) => {
    currentData.key = e.target.value;
    renderChartView(currentData);
  });

  sheet.addEventListener('focusout', (e) => {
    const el = e.target;
    if (!el.hasAttribute || !el.hasAttribute('data-path') || !currentData) return;
    const path = JSON.parse(el.getAttribute('data-path'));
    setAtPath(currentData, path, el.textContent.trim());
  });
}

// ---------- boot ----------
updateAuthUI();
attemptSilentSignIn();
renderLibraryView();
</script>
